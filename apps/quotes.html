<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Quotes · free quotes and proposals</title>
<meta name="description" content="Quotes and proposals from your own price list: line items, discounts, tax, totals, statuses, print-to-PDF, linked to your CRM deals, accepted in one click into an invoice. Free, open source, runs in your browser. Imports Qwilr, Proposify, Better Proposals, PandaDoc and Zoho CSV exports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css">
<style>
.paper{background:#fff;color:#16161a;border-radius:var(--r);padding:44px 48px;max-width:820px;margin:0 auto}
.paper .h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.paper .grey{color:#71717a}
.paper .pre{white-space:pre-wrap;line-height:1.45}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#71717a;padding:8px 0;border-bottom:2px solid #16161a;font-weight:600}
.paper td{padding:9px 0;border-bottom:1px solid #e4e4e8;vertical-align:top}
.paper .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.paper .tot td{border-bottom:none;padding:4px 0}
.itemrow{display:grid;grid-template-columns:1fr 68px 104px 96px 32px;gap:8px;align-items:center}
.itemrow+.itemrow{margin-top:8px}
.itemrow .ro{text-align:right;font-family:var(--mono);font-size:13px;color:var(--mute)}
.plrow{display:grid;grid-template-columns:1fr 90px 104px 32px;gap:8px;align-items:center}
.plrow+.plrow{margin-top:8px}
.late{color:var(--red)}
@media print{
  body{background:#fff}
  .top,.noprint,.toast,dialog{display:none!important}
  .app{padding:0}
  .paper{max-width:none;border-radius:0;padding:0}
}
</style></head><body>
<main class="wrap app" id="app"></main>
<dialog id="dlg"></dialog>
<script src="../assets/nol.js"></script>
<script>
const { store, h, toast, fmtDate, pickFile, readFile, csvToObjects, mapHeaders, pick, toCSV, download, empty } = NOL;
NOL.topbar('quotes');
const SPEC = {
  number: ['quote number', 'quote #', 'quote no', 'quote no.', 'quotation number', 'proposal number', 'proposal id', 'quote id', 'document number', 'number', 'no.', 'quote', 'proposal'],
  title: ['quote name', 'proposal name', 'quote title', 'proposal title', 'project name', 'document name', 'title', 'subject', 'name'],
  client: ['client name', 'customer name', 'account name', 'recipient', 'client', 'customer', 'company', 'organization', 'account', 'billed to', 'bill to', 'prospect'],
  issued: ['quote date', 'proposal date', 'date created', 'created date', 'issue date', 'date issued', 'sent date', 'issued', 'created', 'date'],
  valid: ['expiry date', 'expiration date', 'valid until', 'valid till', 'expires on', 'open until', 'expires', 'expiry', 'valid'],
  status: ['quote status', 'proposal status', 'status', 'state', 'stage'],
  desc: ['description', 'item name', 'item', 'product', 'product/service', 'line item', 'service', 'details'],
  qty: ['quantity', 'qty', 'units', 'hours'],
  rate: ['unit price', 'item price', 'unit amount', 'unit cost', 'rate', 'price'],
  amount: ['quote total', 'grand total', 'proposal value', 'total', 'line total', 'item total', 'amount', 'value'],
  discount: ['discount amount', 'discount %', 'discount percent', 'discount'],
  taxrate: ['tax rate', 'tax %', 'tax percent', 'tax percentage'],
  tax: ['tax total', 'tax amount', 'taxtotal', 'tax', 'vat'],
  notes: ['notes', 'note', 'memo', 'terms', 'message', 'introduction', 'comments'],
};
const STATUSES = NOL.QUOTE_STATUSES;
let sel = (location.hash.match(/open=([\w-]+)/) || [])[1] || null, filter = '', q = ''; // CRM and search deep-link a quote as quotes.html#open=<id>
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
const money = n => NOL.money(n);
const today = () => new Date().toISOString().slice(0, 10);
const totals = NOL.quoteTotals, isExpired = NOL.quoteExpired, isOpen = NOL.quoteOpen;
const effStatus = x => isExpired(x) ? 'expired' : x.status; // what the badge says is what the filter goes by: a sent quote past its own date reads as expired in both places
const nextNumber = issued => NOL.nextQuoteNumber(issued || today());
function ensureCompany(name) { name = (name || '').trim(); if (!name) return null; let c = store.all('companies').find(x => x.name.toLowerCase() === name.toLowerCase()); if (!c) c = store.add('companies', { name }); return c.id; }
const companyName = id => (store.get('companies', id) || {}).name || '';
const dealOf = q => store.get('deals', q.dealId);
/* the price list: what this company sells, plus whatever is already on the Inventory shelves — one data model, so a stock item never has to be retyped */
function priceList() {
  const own = store.all('pricelist').map(p => ({ name: p.name, unit: p.unit || '', rate: +p.rate || 0 }));
  const taken = new Set(own.map(p => p.name.toLowerCase()));
  const stock = store.all('items').filter(i => i.name && !taken.has(String(i.name).toLowerCase())).map(i => ({ name: i.name, unit: i.sku || '', rate: +i.cost || 0 }));
  return [...own, ...stock].sort((a, b) => a.name.localeCompare(b.name));
}
const priceOf = name => priceList().find(p => p.name.toLowerCase() === String(name || '').trim().toLowerCase());

function render() {
  if (sel && !store.get('quotes', sel)) sel = null;
  if (sel) { app.replaceChildren(...detail(store.get('quotes', sel))); return; }
  const all = store.all('quotes');
  const vis = all.filter(x => (!filter || effStatus(x) === filter) && (!q || (JSON.stringify(x) + companyName(x.clientId)).toLowerCase().includes(q)))
    .sort((a, b) => (b.issued || '').localeCompare(a.issued || '') || (b.created || '').localeCompare(a.created || ''));
  const open = all.filter(isOpen).reduce((s, x) => s + totals(x).total, 0);
  const won = all.filter(x => x.status === 'accepted').reduce((s, x) => s + totals(x).total, 0);
  const stale = all.filter(x => isExpired(x)).length;
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'Quotes'), h('p', { class: 'mute' }, `${all.length} quotes · ${money(open)} open${stale ? ' · ' : ''}`, stale ? h('span', { class: 'late' }, `${stale} expired`) : null, ` · ${money(won)} accepted`)),
      h('div', { class: 'toolbar' },
        h('input', { class: 'input', placeholder: 'Search…', value: q, oninput: e => { q = e.target.value.toLowerCase(); render(); } }),
        NOL.currencySelect(),
        h('button', { class: 'btn ghost', onclick: priceDialog }, 'Price list'),
        h('button', { class: 'btn', onclick: importCSV }, 'Import CSV'),
        h('button', { class: 'btn ghost', onclick: exportCSV }, 'Export CSV'),
        h('button', { class: 'btn acid', onclick: () => edit() }, '+ Quote'))),
    h('div', { class: 'row', style: 'margin-bottom:16px' }, [['', 'All'], ...STATUSES.map(s => [s, s[0].toUpperCase() + s.slice(1)])].map(([f, n]) =>
      h('button', { class: 'btn sm' + (filter === f ? ' acid' : ' ghost'), onclick: () => { filter = f; render(); } }, n))),
    body(vis));
}
function body(vis) {
  if (!vis.length && !q && !filter) return empty('No quotes yet', 'Build one from your price list, or import a CSV from Qwilr, Proposify, Better Proposals, PandaDoc or Zoho.');
  if (!vis.length) return h('p', { class: 'mute' }, 'Nothing found');
  const badge = x => h('span', { class: 'badge ' + ({ accepted: 'ok', sent: 'blue', declined: 'red', expired: 'red', draft: '' }[effStatus(x)] || '') }, effStatus(x));
  return h('div', { class: 'card pad0' }, h('table', { class: 'table' },
    h('thead', {}, h('tr', {}, ['Number', 'Quote', 'Client', 'Issued', 'Valid until', 'Total', 'Status'].map(t => h('th', {}, t)))),
    h('tbody', {}, vis.map(x => h('tr', { class: 'click', onclick: () => { sel = x.id; render(); } },
      h('td', {}, h('b', { class: 'mono' }, x.number)),
      h('td', {}, x.title || '—'),
      h('td', {}, x.clientId && companyName(x.clientId) ? h('a', { class: 'acid', href: 'company-page.html?id=' + x.clientId, onclick: e => e.stopPropagation() }, companyName(x.clientId)) : ''),
      h('td', { class: 'mute' }, fmtDate(x.issued)),
      h('td', { class: isExpired(x) ? 'late' : 'mute' }, fmtDate(x.valid)),
      h('td', { class: 'num' }, money(totals(x).total)),
      h('td', {}, badge(x)))))));
}
const LBL = 'font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px';
function detail(x) {
  const client = companyName(x.clientId), t = totals(x);
  const mark = (status, label, cls) => h('button', { class: 'btn ' + cls, onclick: () => { store.update('quotes', x.id, { status }); render(); } }, label);
  const stamp = isExpired(x) ? ['EXPIRED', '#dc2626'] : { accepted: ['ACCEPTED', '#16a34a'], declined: ['DECLINED', '#dc2626'], expired: ['EXPIRED', '#dc2626'], draft: ['DRAFT', '#71717a'] }[x.status] || ['SENT', '#16161a'];
  const deal = dealOf(x), invoice = x.invoiceId && store.get('invoices', x.invoiceId);
  return [
    h('div', { class: 'row between noprint', style: 'margin-bottom:16px' },
      h('button', { class: 'btn ghost', onclick: () => { sel = null; render(); } }, '← All quotes'),
      h('div', { class: 'row' },
        x.status === 'draft' && mark('sent', 'Mark sent', ''),
        x.status !== 'accepted' ? mark('accepted', 'Mark accepted', '') : null,
        x.status !== 'declined' ? mark('declined', 'Mark declined', 'ghost') : null,
        x.status === 'accepted' && !invoice ? h('button', { class: 'btn', onclick: () => toInvoice(x) }, 'Create invoice') : null,
        h('button', { class: 'btn', onclick: () => edit(x) }, 'Edit'),
        h('button', { class: 'btn acid', onclick: () => window.print() }, 'Print / PDF'),
        h('button', { class: 'btn ghost danger', onclick: () => { if (confirm(NOL.t(`Delete quote ${x.number}?`))) { store.remove('quotes', x.id); sel = null; render(); } } }, 'Delete'))),
    (deal || invoice) ? h('p', { class: 'mute noprint', style: 'margin:-8px 0 14px' },
      deal ? h('span', {}, 'Deal') : null, deal ? ' ' : null,
      deal ? h('a', { class: 'acid', href: 'crm.html#open=' + deal.id }, deal.name) : null,
      deal && invoice ? ' · ' : null,
      invoice ? h('span', {}, 'Invoice') : null, invoice ? ' ' : null,
      invoice ? h('a', { class: 'acid', href: 'invoices.html#open=' + invoice.id }, invoice.number) : null) : null,
    h('div', { class: 'paper stack' },
      h('div', { class: 'row between', style: 'align-items:flex-start' },
        h('div', {}, h('div', { class: 'h1' }, 'Quote'), h('div', { class: 'mono grey', style: 'margin-top:6px' }, x.number)),
        h('div', { style: `text-align:right;font-weight:700;color:${stamp[1]}` }, stamp[0])),
      x.title ? h('div', { style: 'font-size:20px;font-weight:700' }, x.title) : null,
      h('div', { class: 'grid g2', style: 'margin-top:20px' },
        h('div', {}, h('div', { class: 'grey', style: LBL }, 'From'), h('div', { class: 'pre' }, x.from || '—')),
        h('div', {}, h('div', { class: 'grey', style: LBL }, 'Prepared for'), h('div', { class: 'pre' }, x.billto || client || '—'))),
      h('div', { class: 'row', style: 'gap:32px' },
        h('div', {}, h('span', { class: 'grey' }, 'Issued '), h('b', {}, fmtDate(x.issued) || '—')),
        h('div', {}, h('span', { class: 'grey' }, 'Valid until '), h('b', { class: isExpired(x) ? 'late' : '' }, fmtDate(x.valid) || '—'))),
      h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Description'), h('th', { style: 'text-align:right' }, 'Qty'), h('th', { style: 'text-align:right' }, 'Rate'), h('th', { style: 'text-align:right' }, 'Amount'))),
        h('tbody', {}, (x.items || []).map(it => h('tr', {}, h('td', {}, it.desc), h('td', { class: 'num' }, +it.qty || 0), h('td', { class: 'num' }, money(it.rate)), h('td', { class: 'num' }, money((+it.qty || 0) * (+it.rate || 0))))))),
      h('div', { class: 'row', style: 'justify-content:flex-end' }, h('table', { style: 'width:auto;min-width:300px' }, h('tbody', {},
        h('tr', { class: 'tot' }, h('td', { class: 'grey' }, 'Subtotal'), h('td', { class: 'num' }, money(t.sub))),
        t.disc ? h('tr', { class: 'tot' }, h('td', { class: 'grey' }, h('span', {}, 'Discount'), String(x.discount).includes('%') ? ' · ' + String(x.discount).trim() : ''), h('td', { class: 'num' }, '−' + money(t.disc))) : null,
        (+x.taxRate || 0) ? h('tr', { class: 'tot' }, h('td', { class: 'grey' }, `Tax (${+x.taxRate}%)`), h('td', { class: 'num' }, money(t.tax))) : null,
        h('tr', { class: 'tot' }, h('td', {}, h('b', {}, 'Total')), h('td', { class: 'num' }, h('b', {}, money(t.total))))))),
      x.notes ? h('div', { class: 'grey pre', style: 'border-top:1px solid #e4e4e8;padding-top:14px;font-size:13px' }, x.notes) : null),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.filesPanel('quotes', x.id)),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.notesPanel('quotes', x.id))].filter(Boolean);
}
function toInvoice(x) {                                                          // an accepted quote is already the whole invoice: lines, tax and your own details carry over, the discount as a line of its own
  const t = totals(x);
  const items = (x.items || []).map(i => ({ desc: i.desc, qty: i.qty, rate: i.rate }));
  if (t.disc) items.push({ desc: NOL.t('Discount'), qty: 1, rate: -Math.round(t.disc * 100) / 100 });
  const inv = store.add('invoices', {
    number: NOL.nextInvoiceNumber(today()), clientId: x.clientId, issued: today(), due: new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10),
    status: 'draft', taxRate: +x.taxRate || 0, from: x.from || '', billto: x.billto || '', bank: '', notes: x.notes || '', items, payments: [], quoteOf: x.id,
  });
  store.update('quotes', x.id, { invoiceId: inv.id });
  toast('Invoice created from this quote.');
  location.href = 'invoices.html#open=' + inv.id;
}
function edit(x = {}) {
  const items = (x.items && x.items.length ? x.items : [{ desc: '', qty: 1, rate: '' }]).map(i => ({ ...i }));
  const last = f => store.all('quotes').map(i => i[f]).filter(Boolean).pop() || ''; // your own details carry over from the quote before
  const from = x.from ?? last('from');
  const list = priceList();
  const rowsBox = h('div'), totBox = h('div', { class: 'mono mute', style: 'text-align:right;margin-top:8px;font-size:13px' });
  const taxInput = h('input', { class: 'input', name: 'taxRate', type: 'number', step: 'any', min: 0, value: x.taxRate ?? 0, oninput: () => retot() });
  const discInput = h('input', { class: 'input', name: 'discount', value: x.discount ?? '', placeholder: '10% or 500', oninput: () => retot() });
  const retot = () => {
    const sub = items.reduce((a, i) => a + (+i.qty || 0) * (+i.rate || 0), 0);
    const t = NOL.quoteTotals({ items, discount: discInput.value, taxRate: taxInput.value });
    totBox.textContent = `${NOL.t('Subtotal')} ${money(sub)} · ${NOL.t('Discount')} ${money(t.disc)} · ${NOL.t('Tax')} ${money(t.tax)} · ${NOL.t('Total')} ${money(t.total)}`;
  };
  const drawRows = () => rowsBox.replaceChildren(
    h('div', { class: 'itemrow', style: 'font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mute)' }, h('span', {}, 'Description'), h('span', {}, 'Qty'), h('span', {}, 'Rate'), h('span', { style: 'text-align:right' }, 'Amount'), h('span')),
    ...items.map((it, i) => {
      const amt = h('div', { class: 'ro' }, money((+it.qty || 0) * (+it.rate || 0)));
      const rate = h('input', { class: 'input', type: 'number', step: 'any', placeholder: '0.00', value: it.rate ?? '', oninput: e => { it.rate = e.target.value; upd(); } });
      const upd = () => { amt.textContent = money((+it.qty || 0) * (+it.rate || 0)); retot(); };
      return h('div', { class: 'itemrow' },
        h('input', { class: 'input', list: 'plist', value: it.desc || '', placeholder: 'Pick from the price list or type your own…',
          oninput: e => { it.desc = e.target.value; },
          onchange: e => { const p = priceOf(e.target.value); if (p && !(+it.rate)) { it.rate = p.rate; rate.value = p.rate; upd(); } } }), // picking a price-list line fills the rate; a rate you typed yourself is never overwritten
        h('input', { class: 'input', type: 'number', step: 'any', value: it.qty ?? 1, oninput: e => { it.qty = e.target.value; upd(); } }),
        rate, amt,
        h('button', { type: 'button', class: 'btn sm ghost danger', onclick: () => { items.splice(i, 1); if (!items.length) items.push({ desc: '', qty: 1, rate: '' }); drawRows(); retot(); } }, '×'));
    }));
  drawRows(); retot();
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries());
    const rec = { number: v.number.trim() || nextNumber(v.issued), title: v.title.trim(), clientId: ensureCompany(v.client), dealId: v.dealId || '', issued: v.issued, valid: v.valid, status: v.status,
      discount: v.discount.trim(), taxRate: +v.taxRate || 0, from: v.from, billto: v.billto, notes: v.notes,
      items: items.map(i => ({ desc: String(i.desc || '').trim(), qty: +i.qty || 0, rate: +i.rate || 0 })).filter(i => i.desc || i.rate) };
    if (x.id) store.update('quotes', x.id, rec); else sel = store.add('quotes', rec).id;
    dlg.close(); render();
  } },
    h('h3', {}, x.id ? 'Edit quote' : 'New quote'),
    h('datalist', { id: 'plist' }, list.map(p => h('option', { value: p.name }, p.unit ? p.unit + ' · ' + money(p.rate) : money(p.rate)))),
    h('div', { class: 'grid g2' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Number'), h('input', { class: 'input', name: 'number', value: x.number || nextNumber(x.issued) })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Quote name'), h('input', { class: 'input', name: 'title', value: x.title || '', placeholder: 'Website redesign' })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Client'), h('input', { class: 'input', name: 'client', list: 'cc', value: companyName(x.clientId), placeholder: 'Company from CRM or a new one' }), h('datalist', { id: 'cc' }, store.all('companies').map(c => h('option', { value: c.name })))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Deal'), h('select', { class: 'input', name: 'dealId' },
        h('option', { value: '', selected: !x.dealId }, 'Not linked to a deal'),
        store.all('deals').sort((a, b) => String(a.name).localeCompare(String(b.name))).map(d => h('option', { value: d.id, selected: d.id === x.dealId }, d.name)))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Issued'), h('input', { class: 'input', name: 'issued', type: 'date', value: x.issued || today() })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Valid until'), h('input', { class: 'input', name: 'valid', type: 'date', value: x.valid || new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10) })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Status'), h('select', { class: 'input', name: 'status' }, STATUSES.map(s => h('option', { value: s, selected: s === (x.status || 'draft') }, s)))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Tax rate %'), taxInput)),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Line items'), rowsBox,
      h('div', { class: 'row between', style: 'margin-top:8px' },
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { items.push({ desc: '', qty: 1, rate: '' }); drawRows(); } }, '+ Line'),
          h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { dlg.close(); priceDialog(); } }, 'Edit price list')),
        totBox)),
    h('div', { class: 'grid g2' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Discount'), discInput, h('p', { class: 'mute', style: 'font-size:12px;margin-top:4px' }, 'Percent of the subtotal, or an amount off. Tax is charged on what is left.')),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Prepared for'), h('textarea', { class: 'input', name: 'billto', style: 'font-family:var(--font);font-size:14px;min-height:70px', placeholder: 'Defaults to the client name' }, x.billto || ''))),
    h('div', { class: 'grid g2' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'From (your business)'), h('textarea', { class: 'input', name: 'from', style: 'font-family:var(--font);font-size:14px;min-height:70px', placeholder: 'Acme LLC\n1 Main St\nsales@acme.io' }, from)),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Notes / terms'), h('textarea', { class: 'input', name: 'notes', style: 'font-family:var(--font);font-size:14px;min-height:70px', placeholder: 'What is included, delivery time, payment terms' }, x.notes || ''))),
    h('div', { class: 'actions' },
      x.id && h('button', { type: 'button', class: 'btn ghost danger', onclick: () => { if (confirm(NOL.t('Delete quote?'))) { store.remove('quotes', x.id); sel = null; dlg.close(); render(); } } }, 'Delete'),
      h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'btn acid' }, 'Save'))));
  dlg.showModal();
}
function priceDialog() {
  const rows = store.all('pricelist').map(p => ({ id: p.id, name: p.name || '', unit: p.unit || '', rate: p.rate ?? '' }));
  if (!rows.length) rows.push({ name: '', unit: '', rate: '' });
  const box = h('div');
  const draw = () => box.replaceChildren(
    h('div', { class: 'plrow', style: 'font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mute)' }, h('span', {}, 'What you sell'), h('span', {}, 'Unit'), h('span', { style: 'text-align:right' }, 'Rate'), h('span')),
    ...rows.map((r, i) => h('div', { class: 'plrow' },
      h('input', { class: 'input', value: r.name, placeholder: 'Consulting, hour', oninput: e => { r.name = e.target.value; } }),
      h('input', { class: 'input', value: r.unit, placeholder: 'hour', oninput: e => { r.unit = e.target.value; } }),
      h('input', { class: 'input', type: 'number', step: 'any', value: r.rate, placeholder: '0.00', oninput: e => { r.rate = e.target.value; } }),
      h('button', { type: 'button', class: 'btn sm ghost danger', onclick: () => { rows.splice(i, 1); if (!rows.length) rows.push({ name: '', unit: '', rate: '' }); draw(); } }, '×'))));
  draw();
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => {
    e.preventDefault();
    const keep = new Set();
    for (const r of rows) {
      const name = r.name.trim(); if (!name) continue;
      const rec = { name, unit: r.unit.trim(), rate: +r.rate || 0 };
      keep.add(r.id ? (store.update('pricelist', r.id, rec), r.id) : store.add('pricelist', rec).id);
    }
    for (const p of store.all('pricelist')) if (!keep.has(p.id)) store.remove('pricelist', p.id); // a row you cleared out is gone from the list, and recoverable in Trash
    dlg.close(); toast('Price list saved.'); render();
  } },
    h('h3', {}, 'Price list'),
    h('p', { class: 'mute', style: 'margin-bottom:14px' }, 'What this company sells and for how much. Every line of a quote can be picked from here. Inventory items are offered too, at their unit cost.'),
    box,
    h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { rows.push({ name: '', unit: '', rate: '' }); draw(); } }, '+ Line')),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'btn acid' }, 'Save price list'))));
  dlg.showModal();
}
const numval = s => { const v = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return isNaN(v) ? 0 : v; };
const normStatus = s => /accept|approv|won|signed/i.test(s) ? 'accepted' : /declin|reject|lost/i.test(s) ? 'declined' : /expir|lapsed/i.test(s) ? 'expired' : /draft|new/i.test(s) ? 'draft' : 'sent';
const isoDate = v => { const t = Date.parse(v); return isNaN(t) ? '' : new Date(t).toISOString().slice(0, 10); };
async function importCSV() {
  const files = await pickFile('.csv,text/csv', true); let n = 0;
  for (const f of files) {
    const { headers, rows } = csvToObjects(await readFile(f)); if (!rows.length) continue;
    const m = mapHeaders(headers, SPEC);
    if (!m.number && !m.client && !m.title) { toast(`${f.name}: no quote number, name or client column found.`); continue; }
    const lineMode = !!(m.desc || m.qty || m.rate);
    const groups = new Map();
    for (const r of rows) { const k = pick(r, m, 'number') || pick(r, m, 'title') + '|' + pick(r, m, 'client'); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    for (const rs of groups.values()) {
      const r0 = rs[0];
      const rec = { number: pick(r0, m, 'number') || nextNumber(isoDate(pick(r0, m, 'issued'))), title: pick(r0, m, 'title'), clientId: ensureCompany(pick(r0, m, 'client')), dealId: '',
        issued: isoDate(pick(r0, m, 'issued')), valid: isoDate(pick(r0, m, 'valid')), status: m.status ? normStatus(pick(r0, m, 'status')) : 'sent',
        discount: '', taxRate: 0, from: '', billto: '', notes: pick(r0, m, 'notes'), items: [] };
      let taxA = m.tax ? numval(pick(r0, m, 'tax')) : 0;
      let taxRate = m.taxrate ? numval(pick(r0, m, 'taxrate')) : null;
      if (taxRate > 100) { taxA = taxA || taxRate; taxRate = null; } // "Tax" and "Tax %" are the same header name once punctuation is stripped: a 2000 in that column is money, never a rate anybody charges
      if (lineMode) {
        rec.items = rs.map(r => { const qty = numval(pick(r, m, 'qty')) || 1; return { desc: pick(r, m, 'desc') || 'Item', qty, rate: m.rate ? numval(pick(r, m, 'rate')) : numval(pick(r, m, 'amount')) / qty }; });
      } else {
        const tot = numval(pick(r0, m, 'amount')), sub = +(tot - taxA).toFixed(2);
        rec.items = [{ desc: pick(r0, m, 'title') || 'Imported from ' + f.name.replace(/\.csv$/i, ''), qty: 1, rate: sub }];
      }
      if (m.discount) { const d = pick(r0, m, 'discount'); if (numval(d)) rec.discount = /%/.test(d) || /percent/i.test(m.discount) ? numval(d) + '%' : String(numval(d)); }
      const net = NOL.quoteTotals({ items: rec.items, discount: rec.discount }).net;
      rec.taxRate = taxRate != null ? taxRate : (taxA && net > 0 ? +(taxA / net * 100).toFixed(2) : 0); // an export that only carries the tax in money still lands on the right rate
      store.add('quotes', rec); n++;
    }
  }
  if (files.length) { toast(`Imported ${n} quotes.`); filter = ''; render(); }
}
function exportCSV() {
  const rows = [];
  for (const x of store.all('quotes')) for (const it of (x.items && x.items.length ? x.items : [{ desc: '', qty: 0, rate: 0 }])) {
    const t = totals(x);
    rows.push({ number: x.number, 'quote name': x.title || '', client: companyName(x.clientId), deal: (dealOf(x) || {}).name || '', issued: x.issued, 'valid until': x.valid, status: x.status, description: it.desc, quantity: it.qty, rate: it.rate, discount: x.discount || '', 'tax rate': +x.taxRate || 0, total: +t.total.toFixed(2), notes: x.notes || '' });
  }
  download('quotes.csv', toCSV(rows, ['number', 'quote name', 'client', 'deal', 'issued', 'valid until', 'status', 'description', 'quantity', 'rate', 'discount', 'tax rate', 'total', 'notes']), 'text/csv');
}
addEventListener("nol:change", () => render());
render();
