<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Factory · the conveyor from the inside</title>
<meta name="description" content="The conveyor that builds NOL, live: agents at work, spend against budget, the Factory board, QA reports and the build journal. Free, open source, in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css">
<style>
.kcard{cursor:default}
.kcard a.t{color:inherit;text-decoration:none}
.kcard a.t:hover{color:var(--acid)}
.kcard.ask{border-color:rgba(255,184,77,.5);background:linear-gradient(180deg,rgba(255,184,77,.07),transparent)}
.kcard .q{font-size:13px;color:var(--mute);margin-top:6px;white-space:pre-wrap;overflow-wrap:break-word}
.qa .ln{font-size:14px;padding:3px 0;white-space:pre-wrap;overflow-wrap:break-word}
.qa .ln.ok{color:var(--ok)} .qa .ln.bad{color:var(--red)}
.console{margin-top:8px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.console .ln{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:2px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.console .ln time{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.console .ln.do span{font-family:var(--mono)}
.console .ln.ok span{color:var(--ok)}
.console .ln.bad span{color:var(--red)}
.console .hdr{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);font-family:var(--mono)}
.kcard .cmd{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<main class="wrap app" id="app"></main>
<script src="../assets/nol.js"></script>
<script>
const { store, sync, h, val, toast, empty, tile, fmtDur } = NOL;
NOL.topbar('factory');
const DAEMON = 'http://localhost:7777';                 // the conveyor answers only on the owner's machine; CORS is open on /api/state
const LOCAL = location.origin === DAEMON;               // served by the daemon itself: fetch the API same-origin, so it always works here
const LOCAL_APP = DAEMON + '/nol/apps/factory.html';    // the built copy the daemon serves; browsers block a public https page from reaching localhost
const COMMIT = 'https://github.com/murik0995-web/nol/commit/';
const REPO = 'nol';
const STATUSES = ['Queued', 'Building', 'Asking', 'Review', 'Done', 'Blocked'];
const ord = c => Number.isFinite(c.order) ? c.order : 1e9; // apps/tasks.html sorts its Board the same way (ZAVOD-TZ 6.6: the two boards must agree)
const CONVEYOR = 'Конвейер', TESTER = 'Тестировщик';    // the conveyor and the tester agent sign their notes with these names
const DONE = /done|failed|cancelled|reverted|merged/i, WAIT = /inbox|queue|pending/i;
const AUTO_STEPS = ['review', 'merge', 'conflicts', 'tester']; // state.automation keys, in the order the header lists them
const MODELS = ['haiku', 'sonnet', 'opus'];                 // ZAVOD-TZ 5.5: mirrors the daemon's MODELS list (factory/daemon/conveyor.mjs)
const EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];  // `claude --help` carries --effort (checked 2026-09-16, see journal/events)

const app = document.getElementById('app');
const headQuota = h('span', { style: 'display:contents' });   // display:contents: chips act as direct .toolbar flex items, wrapping with it on narrow screens
const headAuto = h('span', { style: 'display:contents' });
const secLive = h('div', { class: 'card', style: 'margin-bottom:16px' });
const secBoard = h('div', { style: 'margin-bottom:16px' });
const secQA = h('div', { style: 'margin-bottom:16px' });
const secLog = h('div', { class: 'card' });
let state = null, live = 'loading';                     // loading | ok | off
let usage = null;                                       // GET /api/usage response, or null while loading/unreachable

const num = v => typeof v === 'number' && isFinite(v) ? v : null;
const usd = n => '$' + (Math.round((+n || 0) * 100) / 100).toFixed(2);
const minsSince = ts => { const t = /^\d+$/.test(String(ts)) ? +ts : Date.parse(ts); return isFinite(t) && t > 0 ? Math.max(0, Math.round((Date.now() - t) / 60000)) : null; }; // the daemon stamps epoch milliseconds
const noteBy = (ref, author) => store.all('notes').filter(n => n.coll === 'tasks' && n.ref === ref && n.author === author).sort((a, b) => String(a.created).localeCompare(String(b.created))).pop();
const hhmmss = ts => { if (!Number.isFinite(ts)) return ''; const d = new Date(ts), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };

/* ---------- agent console (ZAVOD-TZ 5.3) + last-command line on Building cards (5.4) ---------- */
const LIVE_STATUS = /^(running|critic|merging|asking)$/i; // daemon statuses that get an "Agent console" link
const CHATTABLE = /^(asking|needs_review|failed)$/i; // POST /api/task/:id/say only succeeds while the daemon is stopped in one of these — same set the CLI's `conveyor say` checks
const openConsoles = new Set();      // daemon task ids with an expanded console
const consoleData = new Map();       // daemon task id -> last GET /api/task/:id/live response
const cardCmdEls = new Map();        // daemon task id -> the card's last-command <div>, for the current paintBoard()
const elTaskId = new WeakMap();      // card root element -> daemon task id, for the visibility observer
const visibleTaskIds = new Set();    // daemon task ids of Building cards currently on screen
const chatForms = new Map();         // daemon task id -> its /say form element, cached so the 5s console repaint doesn't wipe what's being typed
const cardObserver = new IntersectionObserver(entries => {
  for (const e of entries) {
    const id = elTaskId.get(e.target); if (id == null) continue;
    if (e.isIntersecting) visibleTaskIds.add(id); else visibleTaskIds.delete(id);
  }
});
const lastCmdText = feed => {
  const items = (Array.isArray(feed) ? feed : []).filter(f => f && (f.kind === 'do' || f.kind === 'say'));
  return items.length ? String(items[items.length - 1].text || '').slice(0, 120) : '';
};
function loadCardCmds() {
  for (const id of visibleTaskIds) {
    if (!cardCmdEls.has(id)) continue;
    fetch((LOCAL ? '' : DAEMON) + '/api/task/' + id + '/live', { signal: AbortSignal.timeout(5000) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { const el = cardCmdEls.get(id); if (el) el.textContent = lastCmdText(j && j.feed); })
      .catch(() => {});
  }
}
const daemonTaskForCard = c => {
  const ws = sync.cfg && sync.cfg.repo;
  if (!ws || !state || !Array.isArray(state.tasks)) return null;
  const ref = 'nol:' + ws + ':' + c.id;
  return state.tasks.find(t => t.source_ref === ref) || null;
};
function toggleConsole(id) {
  if (openConsoles.has(id)) { openConsoles.delete(id); chatForms.delete(id); } else { openConsoles.add(id); loadConsoleOnce(id); }
  paintLive();
}
function loadConsoleOnce(id) {
  fetch((LOCAL ? '' : DAEMON) + '/api/task/' + id + '/live', { signal: AbortSignal.timeout(5000) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { consoleData.set(id, j && typeof j === 'object' ? j : { feed: [], runs: [] }); paintLive(); })
    .catch(() => {});
}
function loadConsoles() { openConsoles.forEach(loadConsoleOnce); }
// ZAVOD-TZ 5.5: chat with the running agent. Cached per task id — consolePanel() rebuilds every 5s while
// the console is open, and a freshly built textarea would wipe whatever the owner is mid-typing.
function chatForm(id) {
  const cached = chatForms.get(id);
  if (cached) return cached;
  let ta;
  const send = () => {
    const text = ta.value.trim();
    if (!text) return;
    fetch((LOCAL ? '' : DAEMON) + '/api/task/' + id + '/say', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ note: text })
    })
      .then(r => r.ok ? r.json() : r.json().catch(() => ({})).then(j => Promise.reject(new Error((j && j.error) || ('HTTP ' + r.status)))))
      .then(() => { ta.value = ''; toast('Sent. The agent gets it at its next step'); })
      .catch(e => toast(e && e.message ? val(e.message) : 'Could not reach the conveyor.'));
  };
  ta = h('textarea', {
    class: 'input', rows: 2,
    placeholder: 'Write to the agent. Enter sends, Shift+Enter adds a line',
    style: 'font-family:var(--font);font-size:13px;min-height:54px;margin-top:8px',
    onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
  });
  const el = h('div', { style: 'margin-top:8px' }, ta, h('div', { class: 'row', style: 'margin-top:6px' }, h('button', { class: 'btn sm acid', onclick: send }, 'Send')));
  chatForms.set(id, el);
  return el;
}
function consolePanel(t) {
  const data = consoleData.get(t.id);
  if (!data) return h('div', { class: 'console' }, h('p', { class: 'mute' }, 'Loading…'));
  const feed = Array.isArray(data.feed) ? data.feed : [];
  const runs = Array.isArray(data.runs) ? data.runs : [];
  const lastRun = runs.length ? runs[runs.length - 1] : null;
  const line = f => h('div', { class: 'ln ' + (f.kind || '') },
    h('time', {}, hhmmss(f.ts)),
    h('span', { 'data-notranslate': true }, f.kind === 'do' ? '$ ' + String(f.text || '').slice(0, 200) : String(f.text || '')));
  return h('div', { class: 'console' },
    feed.map(line),
    h('div', { class: 'hdr', 'data-notranslate': true }, [t.key, t.status, t.model, lastRun ? 'round ' + lastRun.round : null].filter(Boolean).join(' · ')),
    CHATTABLE.test(t.status || '') ? chatForm(t.id) : h('p', { class: 'mute', style: 'margin-top:8px' }, 'You can write once the agent pauses or finishes.'));
}
const row = (t, extra) => h('div', { class: 'it' },
  h('span', { class: 'badge' + (/failed/i.test(t.status || '') ? ' red' : /done/i.test(t.status || '') ? ' ok' : ' blue') }, t.key || t.status || '—'),
  h('span', { class: 'grow', 'data-notranslate': true }, t.title || t.key || '—'),
  extra);
function taskRow(t, extra) {
  const open = openConsoles.has(t.id);
  if (!open && !LIVE_STATUS.test(t.status || '')) return [row(t, extra)];
  const link = h('a', { class: 'acid', href: '#', style: 'margin-left:10px;white-space:nowrap', onclick: e => { e.preventDefault(); toggleConsole(t.id); } }, open ? 'Hide console' : 'Agent console');
  const r = row(t, [extra, link]);
  return open ? [r, consolePanel(t)] : [r];
}

// plain text with http(s) links turned into anchors: text nodes only, so nothing in a note can inject markup
function linkified(s) {
  const out = h('span'), re = /https?:\/\/[^\s<>"'`]+/g;
  let i = 0, m;
  while ((m = re.exec(String(s)))) {
    const url = m[0].replace(/[.,;:)\]]+$/, '');
    if (m.index > i) out.append(String(s).slice(i, m.index));
    out.append(h('a', { class: 'acid', href: url, target: '_blank', rel: 'noopener' }, url));
    i = m.index + url.length;
  }
  if (i < String(s).length) out.append(String(s).slice(i));
  return out;
}

/* ---------- 0 · HEAD: quota chips + automation badge from the daemon on the owner's Mac ---------- */
function quotaChip(l) {                                 // one badge per /api/usage limits[] entry (ZAVOD-TZ 5.1)
  const pct = Math.round(Number(l.percent)) || 0;
  const ru = NOL.lang() === 'ru';
  const label = l.kind === 'session' ? (ru ? '5ч' : '5h') + ' ' + pct + '%'
    : l.kind === 'weekly_scoped' ? (ru ? '7д' : '7d') + ((l.scope && l.scope.model && l.scope.model.display_name) ? ' ' + l.scope.model.display_name : '') + ' ' + pct + '%'
    : (ru ? '7д' : '7d') + ' ' + pct + '%'; // weekly_all, and any future kind, get the plain 7-day label
  const resetsAt = Date.parse(l.resets_at);
  // hardcoded, not NOL.t(): the chip is data-notranslate so the walker never fixes this up, and NOL.t() here would race the async-loaded ru dictionary
  const title = isFinite(resetsAt) ? (ru ? 'сброс' : 'resets') + ' ' + new Date(resetsAt).toLocaleString(ru ? 'ru-RU' : 'en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  // the whole chip is data-notranslate: it mixes a translated unit with a raw percent and, for weekly_scoped, an untranslated model name
  return h('span', { class: 'badge' + (pct >= 90 ? ' red' : pct >= 70 ? ' amber' : ''), title, 'data-notranslate': true }, label);
}
function paintHead() {
  const limits = usage && !usage.error && Array.isArray(usage.limits) ? usage.limits : null;
  headQuota.replaceChildren(...(limits && limits.length ? limits.map(quotaChip) : [h('span', { class: 'badge' }, 'Quota unavailable')]));
  const on = state && state.automation ? AUTO_STEPS.filter(k => state.automation[k]) : [];
  // each step name is its own text node so the translator can match 'review'/'merge'/… individually; a joined string like 'review · merge' would never hit an exact dictionary key
  headAuto.replaceChildren(...(on.length ? [h('span', { class: 'badge' }, 'Automation', ': ', ...on.flatMap((k, i) => i ? [' · ', k] : [k]))] : []));
}
function loadUsage() {
  fetch((LOCAL ? '' : DAEMON) + '/api/usage', { signal: AbortSignal.timeout(5000) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { usage = j && typeof j === 'object' ? j : null; paintHead(); })
    .catch(() => { usage = null; paintHead(); });
}

/* ---------- 1 · LIVE: the daemon on the owner's Mac ---------- */
function paintLive() {
  const head = h('h3', { class: 'h' }, 'Live', h('a', { href: DAEMON, target: '_blank', rel: 'noopener' }, 'localhost:7777 →'));
  if (live !== 'ok' || !state) {
    if (live === 'off' && !LOCAL) return secLive.replaceChildren(head,
      h('p', { class: 'mute' }, 'The live conveyor is visible only on the Mac where it runs.'),
      h('a', { class: 'btn sm', href: LOCAL_APP }, 'Open the live Factory on this Mac'));
    return secLive.replaceChildren(head, h('p', { class: 'mute' }, live === 'loading'
      ? 'Checking the conveyor…'
      : 'The conveyor daemon runs on the owner’s Mac. It is not reachable from here, so this section stays quiet.'));
  }
  const tasks = (Array.isArray(state.tasks) ? state.tasks : []).filter(t => t && (!t.repo || t.repo === REPO));
  const fin = tasks.filter(t => DONE.test(t.status || ''));
  const queued = tasks.filter(t => WAIT.test(t.status || ''));
  const running = tasks.filter(t => !fin.includes(t) && !queued.includes(t)); // running, asking, and anything new the daemon invents: better shown than hidden
  const busy = num(state.busy), slots = num(state.slots);
  const spent = num(state.today) != null ? num(state.today) : num(state.cost);
  const budget = num(state.budget);
  secLive.replaceChildren(head,
    h('div', { class: 'grid g3', style: 'margin:14px 0 18px' },
      tile(busy != null && slots != null ? busy + ' / ' + slots : '—', 'agents busy', { cls: busy ? 'acc' : '' }),
      tile(spent == null ? '—' : budget != null ? usd(spent) + ' / ' + usd(budget) : usd(spent), 'spent today', { cls: budget && spent > budget * 0.8 ? 'warn' : '' }),
      tile(state.paused ? 'Paused' : 'Running', 'conveyor', { cls: state.paused ? 'warn' : '' })),
    h('h4', { class: 'f' }, 'Now building'),
    running.length ? h('div', { class: 'list' }, running.flatMap(t => taskRow(t,
      h('span', { class: 'm' }, [t.model, minsSince(t.updated_at || t.created_at) != null ? fmtDur(minsSince(t.updated_at || t.created_at)) : null, num(t.cost) != null ? usd(t.cost) : null].filter(Boolean).join(' · ')))))
      : h('p', { class: 'mute' }, 'Nothing is building right now.'),
    h('h4', { class: 'f', style: 'margin-top:16px' }, 'Waiting in the queue'),
    queued.length ? h('div', { class: 'list' }, queued.map(t => row(t, h('span', { class: 'm' }, t.attempts ? 'attempt ' + t.attempts : ''))))
      : h('p', { class: 'mute' }, 'The queue is empty.'),
    h('h4', { class: 'f', style: 'margin-top:16px' }, 'Last finished'),
    fin.length ? h('div', { class: 'list' }, fin.slice().sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || ''))).slice(0, 8).flatMap(t => taskRow(t,
      h('span', { class: 'm' },
        num(t.cost) != null ? usd(t.cost) : null,
        t.merge_sha ? h('a', { class: 'acid', href: COMMIT + t.merge_sha, target: '_blank', rel: 'noopener', style: 'margin-left:8px' }, ' · ' + String(t.merge_sha).slice(0, 7)) : null))))
      : h('p', { class: 'mute' }, 'Nothing has shipped yet today.'));
}
function loadLive() {
  fetch((LOCAL ? '' : DAEMON) + '/api/state', { signal: AbortSignal.timeout(5000) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { state = j && typeof j === 'object' ? j : null; live = state ? 'ok' : 'off'; paintLive(); paintHead(); })
    .catch(() => { state = null; live = 'off'; paintLive(); paintHead(); });
}

/* ---------- 2 · BOARD: the Factory project of this workspace ---------- */
function paintBoard() {
  cardObserver.disconnect(); cardCmdEls.clear();
  const cards = store.all('tasks').filter(t => t.project === 'Factory');
  const head = h('div', { class: 'row between', style: 'margin-bottom:12px' },
    h('h3', {}, 'Board'), h('a', { class: 'btn sm ghost', href: 'tasks.html' }, 'Open in Tasks →'));
  if (!cards.length) return secBoard.replaceChildren(head, empty('The board is empty', 'Cards in the project “Factory” of this workspace show up here. The conveyor writes their status, asks its questions and files QA reports as notes.'));
  const extra = [...new Set(cards.map(c => c.status).filter(s => s && !STATUSES.includes(s)))];
  const col = st => {
    const list = cards.filter(c => (c.status || '') === st).sort((a, b) => ord(a) - ord(b) || String(a.created || '').localeCompare(String(b.created || '')));
    return h('div', { class: 'col' },
      h('h4', {}, h('span', {}, st), h('span', { class: 'mono' }, String(list.length))),
      list.map(c => card(c, st)));
  };
  secBoard.replaceChildren(head, h('div', { class: 'kanban' }, [...STATUSES, ...extra].map(col)));
}
function buildNow(c) { // ZAVOD-TZ 5.6/6.6: urgent + rank below the Queued minimum so nolSync (rank) and the tasks.html Board (order) both put it first
  const queued = store.all('tasks').filter(t => t.project === 'Factory' && t.status === 'Queued');
  const min = f => Math.min(1e9, ...queued.map(t => Number.isFinite(t[f]) ? t[f] : 1e9));
  store.update('tasks', c.id, { priority: 'urgent', rank: min('rank') - 1, order: min('order') - 1 });
  toast('The conveyor picks it up within a minute.'); paintBoard();
}
function card(c, st) {
  const asking = st === 'Asking';
  const queued = st === 'Queued';
  const q = asking && noteBy(c.id, CONVEYOR);
  const ta = asking ? h('textarea', { class: 'input', placeholder: 'Answer', style: 'font-family:var(--font);font-size:13px;min-height:54px;margin-top:8px' }) : null;
  const send = () => {
    const v = ta.value.trim(); if (!v) return;
    store.add('notes', { coll: 'tasks', ref: c.id, text: v, author: (sync.cfg && sync.cfg.user) || '' });
    ta.value = ''; toast('Answer sent. The conveyor reads it as the owner’s answer.'); paintBoard(); paintQA();
  };
  const dt = c.status === 'Building' ? daemonTaskForCard(c) : null; // ZAVOD-TZ 5.4: last do/say line of the matching daemon task
  const cmd = dt ? h('div', { class: 'cmd', 'data-notranslate': true }) : null;
  // ZAVOD-TZ 5.5: model + effort picked before the conveyor takes the card; permissions are fixed, badge only
  const picks = queued ? h('div', { class: 'row', style: 'margin-top:8px;gap:6px' },
    h('select', { class: 'input', style: 'min-width:0;width:auto', onchange: e => store.update('tasks', c.id, { model: e.target.value }) },
      h('option', { value: '' }, 'Model'),
      MODELS.map(m => h('option', { value: m, selected: c.model === m, 'data-notranslate': true }, m))),
    h('select', { class: 'input', style: 'min-width:0;width:auto', onchange: e => store.update('tasks', c.id, { effort: e.target.value }) },
      h('option', { value: '' }, 'Effort'),
      EFFORTS.map(x => h('option', { value: x, selected: c.effort === x, 'data-notranslate': true }, x))),
    h('span', { class: 'badge' }, 'permissions: as task agents')) : null;
  const root = h('div', { class: 'kcard' + (asking ? ' ask' : '') },
    h('a', { class: 't', href: 'tasks.html#open=' + c.id }, c.title ? val(c.title) : 'Untitled'),
    h('div', { class: 'm' }, c.assignee && val(c.assignee), c.priority && h('span', { class: 'badge ' + ({ urgent: 'red', high: 'amber', low: '' }[c.priority] || 'blue') }, c.priority)),
    c.status === 'Queued' ? h('button', { class: 'btn sm ghost', style: 'margin-top:6px', onclick: () => buildNow(c) }, 'Build now') : null,
    q ? h('div', { class: 'q', 'data-notranslate': true }, linkified(q.text)) : asking ? h('div', { class: 'q' }, 'The conveyor is waiting for an answer.') : null,
    cmd,
    picks,
    ta,
    ta && h('div', { class: 'row', style: 'margin-top:6px' }, h('button', { class: 'btn sm acid', onclick: send }, 'Send answer')));
  if (dt) { cardCmdEls.set(dt.id, cmd); elTaskId.set(root, dt.id); cardObserver.observe(root); }
  return root;
}

/* ---------- 3 · QA: what the tester agent found on every shipped card ---------- */
function paintQA() {
  const reports = store.all('tasks').filter(t => t.project === 'Factory' && t.status === 'Done').map(t => [t, noteBy(t.id, TESTER)]).filter(x => x[1]);
  const head = h('h3', { class: 'h' }, 'QA');
  if (!reports.length) return secQA.replaceChildren(h('div', { class: 'card' }, head, h('p', { class: 'mute' }, 'No QA reports yet. The tester agent uses the deployed product after every merge and writes what it found here.')));
  secQA.replaceChildren(h('div', { class: 'card' }, head,
    h('div', { class: 'qa', style: 'margin-top:14px' }, reports.sort((a, b) => String(b[1].created).localeCompare(String(a[1].created))).slice(0, 12).map(([t, n]) => {
      const lines = String(n.text || '').split('\n');
      const verdict = lines.shift() || '';
      return h('div', { style: 'padding:12px 0;border-bottom:1px solid var(--line)' },
        h('div', { class: 'row', style: 'margin-bottom:6px' },
          h('span', { class: 'badge ' + (/✗|дефект/i.test(n.text) ? 'red' : 'ok'), 'data-notranslate': true }, n.author),
          h('a', { class: 'grow', href: 'tasks.html#open=' + t.id, style: 'font-weight:600' }, t.title ? val(t.title) : 'Untitled'),
          h('span', { class: 'm mute mono', style: 'font-size:12px' }, new Date(n.created).toLocaleDateString(NOL.lang() === 'ru' ? 'ru-RU' : 'en-GB', { day: '2-digit', month: 'short' }))),
        h('div', { class: 'ln', 'data-notranslate': true }, linkified(verdict)),
        lines.filter(l => l.trim()).map(l => h('div', { class: 'ln' + (/^\s*✓/.test(l) ? ' ok' : /^\s*✗/.test(l) ? ' bad' : ''), 'data-notranslate': true }, linkified(l))));
    }))));
}

/* ---------- 4 · JOURNAL: the last ten public events ---------- */
function paintLog() {
  const feed = h('div', { class: 'feed' }, h('p', { class: 'mute' }, 'Loading…'));
  secLog.replaceChildren(h('h3', { class: 'h' }, 'Journal', h('a', { href: '../factory.html' }, 'Full log →')), feed);
  fetch('../journal/events.json').then(r => r.json()).then(ev => {
    if (!Array.isArray(ev) || !ev.length) return feed.replaceChildren(h('p', { class: 'mute' }, 'The journal is empty.'));
    feed.replaceChildren(...ev.slice(-10).reverse().map(e => h('div', { class: 'ev' },
      h('time', {}, new Date(e.t).toLocaleString(NOL.lang() === 'ru' ? 'ru-RU' : 'en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })),
      h('div', {}, h('span', { class: 'ty ' + e.type }, e.type), h('b', { 'data-notranslate': true }, (NOL.lang() === 'ru' && e.title_ru) || e.title || ''),
        (e.detail || e.detail_ru) && h('p', { class: 'mute', 'data-notranslate': true }, (NOL.lang() === 'ru' && e.detail_ru) || e.detail || ''),
        e.link && h('a', { class: 'acid', href: e.link, target: '_blank', rel: 'noopener' }, '→')))));
  }).catch(() => feed.replaceChildren(h('p', { class: 'mute' }, 'The journal is not available offline.')));
}

app.replaceChildren(
  h('div', { class: 'app-head' },
    h('div', {}, h('h2', {}, 'Factory'), h('p', { class: 'mute' }, 'The conveyor that builds NOL, from the inside: agents at work, the board, QA and the journal.')),
    h('div', { class: 'toolbar' },
      headQuota, headAuto,
      h('a', { class: 'btn ghost', href: '../factory.html' }, 'Public log'),
      h('a', { class: 'btn', href: DAEMON, target: '_blank', rel: 'noopener' }, 'Open the daemon'))),
  secLive, secBoard, secQA, secLog);
paintHead(); paintLive(); paintBoard(); paintQA(); paintLog();
loadLive(); loadUsage();
setInterval(() => { loadLive(); loadCardCmds(); }, 10000); setInterval(loadUsage, 60000); setInterval(loadConsoles, 5000);
addEventListener("nol:change", () => { paintBoard(); paintQA(); });
</script></body></html>
