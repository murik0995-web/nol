<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Purchase orders · free purchase order software</title>
<meta name="description" content="Purchase orders to your vendors: line items, unit prices, an approval step, received quantities per line and print-to-PDF. Receiving a line raises the stock in Inventory by itself. Free, open source, runs in your browser. Imports Precoro, Procurify, Tradogram and Order.co CSV exports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css">
<style>
.paper{background:#fff;color:#16161a;border-radius:var(--r);padding:44px 48px;max-width:820px;margin:0 auto}
.paper .h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.paper .grey{color:#71717a}
.paper .pre{white-space:pre-wrap;line-height:1.45}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#71717a;padding:8px 0;border-bottom:2px solid #16161a;font-weight:600}
.paper td{padding:9px 0;border-bottom:1px solid #e4e4e8;vertical-align:top}
.paper .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.paper .tot td{border-bottom:none;padding:4px 0}
.porow{display:grid;grid-template-columns:minmax(104px,1fr) 82px 58px 78px 86px 28px;gap:6px;align-items:center}/* six columns inside a 560px dialog: the description keeps a floor so it never shrinks to two letters */
.porow+.porow{margin-top:8px}
.porow .ro{text-align:right;font-family:var(--mono);font-size:13px;color:var(--mute)}
.rcvrow{display:grid;grid-template-columns:1fr 74px 84px 96px;gap:8px;align-items:center}
.rcvrow+.rcvrow{margin-top:8px}
.late{color:var(--red)}
@media print{
  body{background:#fff}
  .top,.noprint,.toast,dialog{display:none!important}
  .app{padding:0}
  .paper{max-width:none;border-radius:0;padding:0}
}
</style></head><body>
<main class="wrap app" id="app"></main>
<dialog id="dlg"></dialog>
<script src="../assets/nol.js"></script>
<script>
const { store, h, toast, fmtDate, pickFile, readFile, csvToObjects, mapHeaders, pick, toCSV, download, empty } = NOL;
NOL.topbar('purchase');
/* headers of the tools this replaces: Precoro (PO Number, Supplier, Item name, Quantity, Price, Received quantity),
   Procurify (Purchase Order #, Vendor, Item Name, Qty, Unit Price, Delivery Date), Tradogram (Document #, Supplier Name, Required By),
   Order.co (Order Number, Vendor Name, Product, Quantity Ordered, Quantity Received). "Received quantity" is claimed before "quantity",
   or the substring pass in mapHeaders would give the wrong column to the ordered amount. */
const SPEC = {
  number: ['po number', 'po #', 'po no', 'purchase order number', 'purchase order #', 'purchase order', 'order number', 'order #', 'document number', 'document #', 'number', 'po'],
  vendor: ['supplier name', 'vendor name', 'supplier', 'vendor', 'merchant', 'seller', 'company', 'payee'],
  issued: ['order date', 'po date', 'purchase order date', 'date created', 'created date', 'issue date', 'date issued', 'issued', 'created', 'date'],
  expected: ['expected delivery date', 'expected delivery', 'delivery date', 'required by', 'need by date', 'need by', 'due date', 'expected date', 'arrival date', 'expected', 'eta'],
  status: ['approval status', 'po status', 'order status', 'status', 'state', 'stage'],
  recv: ['received quantity', 'quantity received', 'qty received', 'received qty', 'quantity delivered', 'delivered quantity', 'receipt quantity', 'received'],
  desc: ['item name', 'item description', 'product name', 'line item', 'description', 'item', 'product', 'service', 'details'],
  sku: ['sku', 'item code', 'product code', 'item number', 'part number', 'part no', 'catalog number', 'barcode', 'code'],
  qty: ['quantity ordered', 'ordered quantity', 'order quantity', 'quantity', 'qty', 'units'],
  rate: ['unit price', 'unit cost', 'item price', 'price per unit', 'rate', 'price', 'cost'],
  amount: ['line total', 'total amount', 'order total', 'po total', 'grand total', 'total', 'amount', 'subtotal', 'value'],
  taxrate: ['tax rate', 'tax %', 'tax percent', 'tax percentage', 'vat rate'],
  tax: ['tax total', 'tax amount', 'tax', 'vat'],
  requester: ['requested by', 'requester', 'requestor', 'ordered by', 'buyer', 'created by'],
  approver: ['approved by', 'approver', 'approved by name'],
  notes: ['notes', 'note', 'memo', 'comments', 'comment', 'remarks', 'terms', 'message'],
};
const STATUSES = NOL.PO_STATUSES;
const STATUS_TONE = { draft: '', pending: 'amber', approved: 'ok', sent: 'blue', rejected: 'red', cancelled: 'red' };
const RECV_LABEL = { none: 'not received', partial: 'partly received', full: 'received' };
const RECV_TONE = { none: '', partial: 'amber', full: 'ok' };
let sel = (location.hash.match(/open=([\w-]+)/) || [])[1] || null, filter = '', q = ''; // global search deep-links an order as purchase.html#open=<id>
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
const money = n => NOL.money(n);
const today = () => new Date().toISOString().slice(0, 10);
const num = v => +v || 0;
const totals = NOL.poTotals, received = NOL.poReceived, isOpen = NOL.poOpen;
const isLate = x => NOL.poLate(x, today());
const nextNumber = issued => NOL.nextPONumber(issued || today());
function ensureCompany(name) { name = (name || '').trim(); if (!name) return null; let c = store.all('companies').find(x => x.name.toLowerCase() === name.toLowerCase()); if (!c) c = store.add('companies', { name }); return c.id; }
const vendorName = id => (store.get('companies', id) || {}).name || '';
const stockList = () => store.all('items').filter(i => i.name || i.sku).sort((a, b) => String(a.name || a.sku).localeCompare(String(b.name || b.sku)));
const stockLabel = i => (i.name || i.sku) + (i.name && i.sku ? ' · ' + i.sku : '');
const stockByLabel = label => stockList().find(i => stockLabel(i) === String(label || '').trim());

function render() {
  if (sel && !store.get('purchases', sel)) sel = null;
  if (sel) { app.replaceChildren(...detail(store.get('purchases', sel))); return; }
  const all = store.all('purchases');
  const match = x => (!q || (JSON.stringify(x) + vendorName(x.vendorId)).toLowerCase().includes(q));
  const vis = all.filter(x => match(x) && (filter === '' ? true : filter === 'late' ? isLate(x) : filter === 'toreceive' ? isOpen(x) && x.status !== 'draft' && x.status !== 'pending' : x.status === filter))
    .sort((a, b) => (b.issued || '').localeCompare(a.issued || '') || (b.created || '').localeCompare(a.created || ''));
  const committed = all.filter(isOpen).reduce((s, x) => s + totals(x).total, 0);
  const lateN = all.filter(isLate).length;
  const pendingN = all.filter(x => x.status === 'pending').length;
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'Purchase orders'),
        h('p', { class: 'mute' },
          h('span', {}, `${all.length} orders`), ' · ',
          h('span', {}, 'on order'), ' ', h('span', { class: 'mono' }, money(committed)),
          pendingN ? ' · ' : '', pendingN ? h('span', {}, `${pendingN} awaiting approval`) : null,
          lateN ? ' · ' : '', lateN ? h('span', { class: 'late' }, `${lateN} late`) : null)),
      h('div', { class: 'toolbar' },
        h('input', { class: 'input', placeholder: 'Search…', value: q, oninput: e => { q = e.target.value.toLowerCase(); render(); } }),
        NOL.currencySelect(),
        h('button', { class: 'btn', onclick: importCSV }, 'Import CSV'),
        h('button', { class: 'btn ghost', onclick: exportCSV }, 'Export CSV'),
        h('button', { class: 'btn acid', onclick: () => edit() }, '+ Purchase order'))),
    h('div', { class: 'row', style: 'margin-bottom:16px' }, [['', 'All'], ...STATUSES.map(s => [s, s[0].toUpperCase() + s.slice(1)]), ['toreceive', 'To receive'], ['late', 'Late']].map(([f, n]) =>
      h('button', { class: 'btn sm' + (filter === f ? ' acid' : ' ghost'), onclick: () => { filter = f; render(); } }, n))),
    body(vis));
}
function body(vis) {
  if (!vis.length && !q && !filter) return empty('No purchase orders yet', 'Order something from a vendor, or import a CSV from Precoro, Procurify, Tradogram or Order.co.');
  if (!vis.length) return h('p', { class: 'mute' }, 'Nothing found');
  return h('div', { class: 'card pad0' }, h('table', { class: 'table' },
    h('thead', {}, h('tr', {}, h('th', {}, 'Number'), h('th', {}, 'Vendor'), h('th', {}, 'Ordered'), h('th', {}, 'Expected'), h('th', { style: 'text-align:right' }, 'Total'), h('th', {}, 'Approval'), h('th', {}, 'Delivery'))),
    h('tbody', {}, vis.map(x => {
      const r = received(x);
      return h('tr', { class: 'click', onclick: () => { sel = x.id; render(); } },
        h('td', {}, h('b', { class: 'mono', 'data-notranslate': true }, x.number)),
        h('td', { 'data-notranslate': true }, x.vendorId && vendorName(x.vendorId) ? h('a', { class: 'acid', href: 'company-page.html?id=' + x.vendorId, onclick: e => e.stopPropagation() }, vendorName(x.vendorId)) : ''),
        h('td', { class: 'mute' }, fmtDate(x.issued)),
        h('td', { class: isLate(x) ? 'late' : 'mute' }, fmtDate(x.expected)),
        h('td', { class: 'num' }, money(totals(x).total)),
        h('td', {}, h('span', { class: 'badge ' + (STATUS_TONE[x.status] || '') }, x.status || 'draft')),
        h('td', {}, h('span', { class: 'badge ' + RECV_TONE[r.state] }, RECV_LABEL[r.state]),
          r.state === 'partial' ? h('span', { class: 'dim mono', style: 'margin-left:8px;font-size:12px' }, r.pct + '%') : null));
    }))));
}
const LBL = 'font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px';
const STAMP = { draft: ['DRAFT', '#71717a'], pending: ['AWAITING APPROVAL', '#b45309'], approved: ['APPROVED', '#16a34a'], sent: ['SENT TO VENDOR', '#16161a'], rejected: ['REJECTED', '#dc2626'], cancelled: ['CANCELLED', '#dc2626'] };
function detail(x) {
  const vendor = vendorName(x.vendorId), t = totals(x), r = received(x);
  const stamp = STAMP[x.status] || STAMP.draft;
  const mark = (patch, label, cls) => h('button', { class: 'btn ' + cls, onclick: () => { store.update('purchases', x.id, patch); render(); } }, label);
  return [
    h('div', { class: 'row between noprint', style: 'margin-bottom:16px' },
      h('button', { class: 'btn ghost', onclick: () => { sel = null; render(); } }, '← All purchase orders'),
      h('div', { class: 'row' },
        x.status === 'draft' ? mark({ status: 'pending' }, 'Send for approval', '') : null,
        x.status === 'pending' || x.status === 'rejected' ? mark({ status: 'approved', approvedAt: today() }, 'Approve', 'acid') : null,
        x.status === 'pending' ? mark({ status: 'rejected', approvedAt: '' }, 'Reject', 'ghost danger') : null,
        x.status === 'approved' ? mark({ status: 'sent' }, 'Mark sent to vendor', '') : null,
        isOpen(x) && (x.status === 'approved' || x.status === 'sent') ? h('button', { class: 'btn acid', onclick: () => receive(x) }, 'Receive') : null,
        !['cancelled', 'rejected'].includes(x.status) ? mark({ status: 'cancelled' }, 'Cancel order', 'ghost') : null,
        h('button', { class: 'btn', onclick: () => edit(x) }, 'Edit'),
        h('button', { class: 'btn', onclick: () => window.print() }, 'Print / PDF'),
        h('button', { class: 'btn ghost danger', onclick: () => { if (confirm(NOL.t('Delete this purchase order? Stock already received stays in Inventory.'))) { store.remove('purchases', x.id); sel = null; render(); } } }, 'Delete'))),
    isLate(x) ? h('p', { class: 'late noprint', style: 'margin:-8px 0 14px' }, 'Late: this order was expected on ' + fmtDate(x.expected) + ' and has not fully arrived.') : null,
    h('div', { class: 'paper stack' },
      h('div', { class: 'row between', style: 'align-items:flex-start' },
        h('div', {}, h('div', { class: 'h1' }, 'Purchase order'), h('div', { class: 'mono grey', style: 'margin-top:6px', 'data-notranslate': true }, x.number)),
        h('div', { style: `text-align:right;font-weight:700;color:${stamp[1]}` }, stamp[0])),
      h('div', { class: 'grid g2', style: 'margin-top:20px' },
        h('div', {}, h('div', { class: 'grey', style: LBL }, 'Vendor'), h('div', { class: 'pre', 'data-notranslate': true }, x.vendorAddr || vendor || '—')),
        h('div', {}, h('div', { class: 'grey', style: LBL }, 'Deliver to'), h('div', { class: 'pre', 'data-notranslate': true }, x.shipto || '—'))),
      h('div', { class: 'row', style: 'gap:32px' },
        h('div', {}, h('span', { class: 'grey' }, 'Ordered '), h('b', {}, fmtDate(x.issued) || '—')),
        h('div', {}, h('span', { class: 'grey' }, 'Expected '), h('b', { class: isLate(x) ? 'late' : '' }, fmtDate(x.expected) || '—')),
        x.requester ? h('div', {}, h('span', { class: 'grey' }, 'Requested by '), h('b', { 'data-notranslate': true }, x.requester)) : null),
      h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Description'), h('th', {}, 'Code'),
          h('th', { style: 'text-align:right' }, 'Qty'), h('th', { style: 'text-align:right' }, 'Received'),
          h('th', { style: 'text-align:right' }, 'Unit price'), h('th', { style: 'text-align:right' }, 'Amount'))),
        h('tbody', {}, (x.items || []).map(it => h('tr', {},
          h('td', { 'data-notranslate': true }, it.desc),
          h('td', { class: 'grey', 'data-notranslate': true }, it.sku || ''),
          h('td', { class: 'num' }, String(num(it.qty))),
          h('td', { class: 'num' }, String(num(it.recv))),
          h('td', { class: 'num' }, money(it.rate)),
          h('td', { class: 'num' }, money(num(it.qty) * num(it.rate))))))),
      h('div', { class: 'row', style: 'justify-content:flex-end' }, h('table', { style: 'width:auto;min-width:300px' }, h('tbody', {},
        h('tr', { class: 'tot' }, h('td', { class: 'grey' }, 'Subtotal'), h('td', { class: 'num' }, money(t.sub))),
        num(x.taxRate) ? h('tr', { class: 'tot' }, h('td', { class: 'grey' }, `Tax (${num(x.taxRate)}%)`), h('td', { class: 'num' }, money(t.tax))) : null,
        h('tr', { class: 'tot' }, h('td', {}, h('b', {}, 'Total')), h('td', { class: 'num' }, h('b', {}, money(t.total))))))),
      x.status === 'approved' || x.status === 'sent'
        ? h('div', { class: 'grey', style: 'border-top:1px solid #e4e4e8;padding-top:14px;font-size:13px' },
          h('span', {}, x.approver ? 'Approved by' : 'Approved'), ' ',       // one word per text node: a sentence glued out of pieces never reaches the dictionary
          x.approver ? h('b', { 'data-notranslate': true }, x.approver) : null,
          x.approvedAt ? h('span', {}, ' · ') : null, x.approvedAt ? h('b', {}, fmtDate(x.approvedAt)) : null)
        : null,
      x.notes ? h('div', { class: 'grey pre', style: 'border-top:1px solid #e4e4e8;padding-top:14px;font-size:13px' }, x.notes) : null),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' },
      h('h3', { style: 'margin-bottom:10px' }, 'Delivery'),
      h('p', { class: 'mute' }, `${r.received} of ${r.ordered} units received`),
      r.state !== 'full' && (x.status === 'approved' || x.status === 'sent')
        ? h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn acid', onclick: () => receive(x) }, 'Receive a delivery')) : null),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.filesPanel('purchases', x.id)),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.notesPanel('purchases', x.id))].filter(Boolean);
}
/* receiving a delivery: what arrived is added to the line, and a line tied to an Inventory item raises the stock and writes its own movement */
function receive(x) {
  const lines = (x.items || []).map((it, i) => ({ i, it, got: '' }));
  const openLines = lines.filter(l => num(l.it.recv) < num(l.it.qty));
  if (!openLines.length) return toast('Everything on this order has already been received.');
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target).entries());
    const items = (x.items || []).map(i => ({ ...i }));
    let units = 0, stocked = 0;
    for (const l of openLines) {
      const n = num(l.got); if (n <= 0) continue;
      items[l.i].recv = num(items[l.i].recv) + n;
      units += n;
      const item = l.it.itemId && store.get('items', l.it.itemId);
      if (item) {
        store.update('items', item.id, { qty: num(item.qty) + n });
        store.add('movements', { itemId: item.id, type: 'in', delta: n, date: v.date || today(), person: v.person.trim(), note: NOL.t('Purchase order') + ' ' + x.number });
        stocked++;
      }
    }
    if (!units) { toast('Nothing received.'); dlg.close(); return; }
    store.update('purchases', x.id, { items });
    dlg.close();
    toast(stocked ? `Received ${units} units, ${stocked} lines added to Inventory.` : `Received ${units} units.`);
    render();
  } },
    h('h3', {}, 'Receive a delivery'),
    h('p', { class: 'mute', style: 'margin-bottom:14px' }, 'How many of each line arrived. A line linked to an Inventory item raises the stock and writes a movement by itself.'),
    h('div', { class: 'rcvrow', style: 'font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mute)' },
      h('span', {}, 'Line'), h('span', { style: 'text-align:right' }, 'Ordered'), h('span', { style: 'text-align:right' }, 'Received'), h('span', { style: 'text-align:right' }, 'Arriving now')),
    ...openLines.map(l => h('div', { class: 'rcvrow' },
      h('div', {}, h('b', { 'data-notranslate': true }, l.it.desc || '—'), l.it.itemId && store.get('items', l.it.itemId) ? h('div', { class: 'dim', style: 'font-size:12px' }, 'In Inventory') : null),
      h('div', { class: 'ro mono', style: 'text-align:right' }, String(num(l.it.qty))),
      h('div', { class: 'ro mono', style: 'text-align:right' }, String(num(l.it.recv))),
      h('input', { class: 'input', type: 'number', step: 'any', min: '0', max: String(num(l.it.qty) - num(l.it.recv)), placeholder: String(num(l.it.qty) - num(l.it.recv)), oninput: e => { l.got = e.target.value; } }))),
    h('div', { class: 'grid g2', style: 'margin-top:14px' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Date'), h('input', { class: 'input', name: 'date', type: 'date', value: today() })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Received by'), h('input', { class: 'input', name: 'person', list: 'pp', value: '', placeholder: 'Person from People' }), h('datalist', { id: 'pp' }, store.all('people').map(p => h('option', { value: p.name }))))),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'btn acid' }, 'Save delivery'))));
  dlg.showModal();
}
function edit(x = {}) {
  const items = (x.items && x.items.length ? x.items : [{ desc: '', sku: '', qty: 1, rate: '', recv: 0 }]).map(i => ({ ...i }));
  const last = f => store.all('purchases').map(i => i[f]).filter(Boolean).pop() || ''; // your own delivery address carries over from the order before
  const shipto = x.shipto ?? last('shipto');
  const stock = stockList();
  const people = store.all('people').map(p => p.name).sort((a, b) => a.localeCompare(b));
  const rowsBox = h('div'), totBox = h('div', { class: 'mono mute', style: 'text-align:right;margin-top:8px;font-size:13px' });
  const taxInput = h('input', { class: 'input', name: 'taxRate', type: 'number', step: 'any', min: 0, value: x.taxRate ?? 0, oninput: () => retot() });
  const retot = () => {
    const t = NOL.poTotals({ items, taxRate: taxInput.value });
    totBox.textContent = `${NOL.t('Subtotal')} ${money(t.sub)} · ${NOL.t('Tax')} ${money(t.tax)} · ${NOL.t('Total')} ${money(t.total)}`;
  };
  const drawRows = () => rowsBox.replaceChildren(
    h('div', { class: 'porow', style: 'font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mute)' },
      h('span', {}, 'Description'), h('span', {}, 'Code'), h('span', {}, 'Qty'), h('span', {}, 'Unit price'), h('span', { style: 'text-align:right' }, 'Amount'), h('span')),
    ...items.map((it, i) => {
      const amt = h('div', { class: 'ro' }, money(num(it.qty) * num(it.rate)));
      const sku = h('input', { class: 'input mono', value: it.sku || '', placeholder: 'SKU', oninput: e => { it.sku = e.target.value; } });
      const rate = h('input', { class: 'input', type: 'number', step: 'any', placeholder: '0.00', value: it.rate ?? '', oninput: e => { it.rate = e.target.value; upd(); } });
      const upd = () => { amt.textContent = money(num(it.qty) * num(it.rate)); retot(); };
      return h('div', { class: 'porow' },
        h('input', { class: 'input', list: 'stk', value: it.desc || '', placeholder: 'Pick an Inventory item or type your own…',
          oninput: e => { it.desc = e.target.value; },
          onchange: e => { // picking a stock item links the line, so receiving it later raises the right shelf; a price you typed yourself is never overwritten
            const s = stockByLabel(e.target.value); if (!s) { it.itemId = ''; return; }
            it.itemId = s.id; it.desc = s.name || s.sku; e.target.value = it.desc;
            if (!it.sku && s.sku) { it.sku = s.sku; sku.value = s.sku; }
            if (!num(it.rate) && num(s.cost)) { it.rate = s.cost; rate.value = s.cost; }
            upd();
          } }),
        sku,
        h('input', { class: 'input', type: 'number', step: 'any', min: '0', value: it.qty ?? 1, oninput: e => { it.qty = e.target.value; upd(); } }),
        rate, amt,
        h('button', { type: 'button', class: 'btn sm ghost danger', onclick: () => { items.splice(i, 1); if (!items.length) items.push({ desc: '', sku: '', qty: 1, rate: '', recv: 0 }); drawRows(); retot(); } }, '×'));
    }));
  drawRows(); retot();
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries());
    const rec = { number: v.number.trim() || nextNumber(v.issued), vendorId: ensureCompany(v.vendor), issued: v.issued, expected: v.expected, status: v.status,
      taxRate: num(v.taxRate), vendorAddr: v.vendorAddr, shipto: v.shipto, requester: v.requester.trim(), approver: v.approver.trim(), notes: v.notes,

const numval = s => { s = String(s ?? '').trim(); const neg = s.startsWith('-') || /^\(.*\)$/.test(s); const v = parseFloat(s.replace(/[^\d.,]/g, '').replace(/,(\d{3})(?!\d)/g, '$1').replace(',', '.')); return isNaN(v) ? 0 : neg ? -v : v; };
const normStatus = s => /reject|declin|denied/i.test(s) ? 'rejected' : /cancel|void|closed/i.test(s) ? 'cancelled' : /pending|await|review|submitted|for approval/i.test(s) ? 'pending' : /approv|confirm|accepted|ok/i.test(s) ? 'approved' : /draft|new/i.test(s) ? 'draft' : 'sent';
// 13/10/2026 or 10/13/2026? The order is decided once per file, by the one date in it that can only be read one way — a single 02/11/2026 read on its own lands nine months out
const dayFirst = vals => { let seen = null; for (const v of vals) { const m = String(v || '').match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{4}/); if (!m) continue; if (+m[1] > 12) return true; if (+m[2] > 12) seen = false; } return seen; };
const toDay = (s, first) => {                                                    // ISO, then day-or-month-first, then whatever the browser understands, always read by local parts
  s = String(s == null ? '' : s).trim(); if (!s) return '';
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if (m) { const [, a, b, y] = m, [d, mo] = (first == null ? +a > 12 : first) ? [a, b] : [b, a]; return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`; } // nothing decisive in the file: US exports outnumber the rest, month first
  const p = Date.parse(s); if (isNaN(p)) return '';
  const t = new Date(p); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; // local parts: toISOString() moves a delivery to the day before east of Greenwich
};
async function importCSV() {
  const files = await pickFile('.csv,text/csv', true); let n = 0;
  for (const f of files) {
    const { headers, rows } = csvToObjects(await readFile(f)); if (!rows.length) continue;
    const m = mapHeaders(headers, SPEC);
    if (!m.number && !m.vendor) { toast(`${f.name}: no purchase order number or vendor column found.`); continue; }
    const lineMode = !!(m.desc || m.qty || m.rate || m.sku);
    const first = dayFirst(rows.flatMap(r => [pick(r, m, 'issued'), pick(r, m, 'expected')])); // one order for the whole file, from the first date in it that can only be read one way
    const groups = new Map();
    for (const r of rows) { const k = pick(r, m, 'number') || pick(r, m, 'vendor') + '|' + pick(r, m, 'issued'); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    for (const rs of groups.values()) {
      const r0 = rs[0];
      const rec = { number: pick(r0, m, 'number') || nextNumber(toDay(pick(r0, m, 'issued'), first)), vendorId: ensureCompany(pick(r0, m, 'vendor')),
        issued: toDay(pick(r0, m, 'issued'), first) || today(), expected: toDay(pick(r0, m, 'expected'), first),
        status: m.status ? normStatus(pick(r0, m, 'status')) : 'sent', taxRate: 0, vendorAddr: '', shipto: '',
        requester: pick(r0, m, 'requester'), approver: pick(r0, m, 'approver'), notes: pick(r0, m, 'notes'), items: [] };
      let taxA = m.tax ? numval(pick(r0, m, 'tax')) : 0;
      let taxRate = m.taxrate ? numval(pick(r0, m, 'taxrate')) : null;
      if (taxRate > 100) { taxA = taxA || taxRate; taxRate = null; } // "Tax" and "Tax %" collapse to the same name once punctuation is stripped: a 2000 in that column is money, never a rate anybody charges
      if (lineMode) {
        rec.items = rs.map(r => {
          const qty = numval(pick(r, m, 'qty')) || 1;
          return { desc: pick(r, m, 'desc') || pick(r, m, 'sku') || 'Item', sku: pick(r, m, 'sku'), itemId: '', qty,
            rate: m.rate ? numval(pick(r, m, 'rate')) : numval(pick(r, m, 'amount')) / qty,
            recv: m.recv ? numval(pick(r, m, 'recv')) : 0 };
        });

        rec.items = [{ desc: 'Imported from ' + f.name.replace(/\.csv$/i, ''), sku: '', itemId: '', qty: 1, rate: sub, recv: 0 }];
      }
      const sub = NOL.poTotals({ items: rec.items }).sub;

}
function exportCSV() {
