<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Desk · free help desk</title>
<meta name="description" content="Tickets, canned replies with variables, SLA targets per priority, ticket merge, replies, priorities and statuses. Free, open source, runs in your browser. Imports Zendesk and Freshdesk CSV exports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css">
<style>.msg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap}.msg.agent{border-color:rgba(217,255,61,.35)}.msg.note{background:rgba(255,184,77,.06);border-color:rgba(255,184,77,.3)}.msg .who{font-size:12px;color:var(--mute);margin-bottom:4px}
tr.late td{background:rgba(255,90,95,.07)}
.macro{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.macro p{white-space:pre-wrap;font-size:13px;margin-top:6px}
.pickt{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;text-align:left;background:var(--bg2);cursor:pointer}.pickt:hover{border-color:var(--acid)}</style></head><body>
<main class="wrap app" id="app"></main>
<dialog id="dlg"></dialog>
<script src="../assets/nol.js"></script>
<script>
const { store, h, toast, fmtDate, pickFile, readFile, csvToObjects, mapHeaders, pick, toCSV, download, empty, slaState } = NOL;
NOL.topbar('desk');
const SPEC = { subject: ['subject', 'title', 'ticket subject', 'summary'], desc: ['description', 'body', 'first comment', 'message', 'latest comment'], status: ['status', 'ticket status'], priority: ['priority'], requester: ['requester', 'requester name', 'customer', 'customer name', 'contact', 'from', 'submitter', 'requester_name'], email: ['requester email', 'customer email', 'contact email', 'email', 'from email'], assignee: ['assignee', 'agent', 'assigned to', 'assignee name'], created: ['created at', 'created', 'date created', 'created date', 'created_at'], tags: ['tags'] };
const STATUSES = ['open', 'pending', 'solved'], PRIOS = ['low', 'normal', 'high', 'urgent'];
const normStatus = s => { s = (s || '').toLowerCase(); return /solved|closed|resolved|done/.test(s) ? 'solved' : /pending|hold|wait/.test(s) ? 'pending' : 'open'; };
const normPrio = p => { p = (p || '').toLowerCase(); return PRIOS.includes(p) ? p : /urgent|critical|p0/.test(p) ? 'urgent' : /high|p1/.test(p) ? 'high' : /low|p3|p4/.test(p) ? 'low' : 'normal'; };
let filter = 'open', q = '', who = '', reply = '', openId = (location.hash.match(/open=([\w-]+)/) || [])[1] || null; // company page deep-links a ticket as desk.html#open=<id>
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
const openTicket = id => { openId = id; reply = ''; }; // the reply in progress belongs to one ticket
const badge = s => h('span', { class: 'badge ' + ({ open: 'red', pending: 'amber', solved: 'ok' }[s] || '') }, s);
const pbadge = p => h('span', { class: 'badge ' + ({ urgent: 'red', high: 'amber', low: '' }[p] || 'blue') }, p);
const agents = () => store.all('people').map(p => p.name);
const companies = () => store.all('companies').sort((a, b) => a.name.localeCompare(b.name));
function ensureContact(name, email) { name = (name || '').trim(); email = (email || '').trim(); if (!name && !email) return; const cs = store.all('contacts'); if (!cs.find(c => (email && c.email === email) || (!email && c.name.toLowerCase() === name.toLowerCase()))) store.add('contacts', { name: name || email, email }); }
function companyOf(t) { // an explicit link wins; otherwise the requester's contact says which company this is
  if (t.companyId) return store.get('companies', t.companyId) || null;
  const cc = store.all('contacts').find(x => (t.email && x.email === t.email) || (t.requester && x.name === t.requester));
  return (cc && cc.companyId && store.get('companies', cc.companyId)) || null;
}
const setStatus = (t, s) => store.update('tickets', t.id, { status: s, solvedAt: s === 'solved' ? NOL.now() : '' }); // one place, so the solve time is always recorded for SLA

/* ---------- SLA: targets per priority, kept as one workspace setting ---------- */
const slaCfg = () => { const s = store.get('settings', 'sla'); return (s && s.hours) || NOL.SLA; };
const isLate = t => t.status !== 'solved' && slaState(t, slaCfg()).breached;
const span = ms => { const m = Math.max(1, Math.round(Math.abs(ms) / 6e4)); return m < 90 ? m + 'm' : m < 2880 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; }; // never '0m': a ticket right on its target reads as one minute, not as nothing
function slaCell(t) {
  const s = slaState(t, slaCfg()), title = s.stage === 'first' ? 'First reply target' : 'Resolution target';
  if (s.stage === 'solved') return h('span', { class: 'badge ' + (s.breached ? 'red' : 'ok'), title }, s.breached ? 'missed' : 'met');
  const left = s.due - s.at;
  return h('span', { class: 'badge ' + (s.breached ? 'red' : left < 36e5 ? 'amber' : ''), title }, span(left) + (s.breached ? ' over' : ' left'));
}
const slaWord = t => { const s = slaState(t, slaCfg()); return s.stage === 'solved' ? (s.breached ? 'missed' : 'met') : s.breached ? 'breached' : 'ok'; };
function slaDialog() {
  const cfg = slaCfg();
  const num = (v, d) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n > 0 ? n : d; };
  const save = hours => { store.get('settings', 'sla') ? store.update('settings', 'sla', { hours }) : store.add('settings', { id: 'sla', hours }); };
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries()); const hours = {}; for (const p of PRIOS) hours[p] = [num(v[p + '-first'], NOL.SLA[p][0]), num(v[p + '-solve'], NOL.SLA[p][1])]; save(hours); dlg.close(); render(); toast('SLA targets saved.'); } },
    h('h3', {}, 'SLA targets'),
    h('p', { class: 'mute', style: 'margin-bottom:14px' }, 'Hours counted from the moment a ticket arrives: until the first agent reply, and until it is solved. A ticket past its target is highlighted in red. These numbers are yours, set them to what you promise your customers.'),
    h('table', { class: 'table' },
      h('thead', {}, h('tr', {}, ['Priority', 'First reply, h', 'Resolution, h'].map(x => h('th', {}, x)))),
      h('tbody', {}, PRIOS.slice().reverse().map(p => h('tr', {},
        h('td', {}, pbadge(p)),
        h('td', {}, h('input', { class: 'input', name: p + '-first', type: 'number', min: '0.5', step: '0.5', value: (cfg[p] || NOL.SLA[p])[0] })),
        h('td', {}, h('input', { class: 'input', name: p + '-solve', type: 'number', min: '0.5', step: '0.5', value: (cfg[p] || NOL.SLA[p])[1] })))))),
    h('div', { class: 'actions', style: 'justify-content:space-between' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => { save(null); slaDialog(); } }, 'Reset to defaults'),
      h('span', { class: 'row' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'), h('button', { class: 'btn acid' }, 'Save')))));
  if (!dlg.open) dlg.showModal();
}

/* ---------- macros: canned replies with variables ---------- */
function fillVars(text, t) {
  const c = companyOf(t), v = { requester: t.requester || '', first: (t.requester || '').trim().split(/\s+/)[0] || '', subject: t.subject || '', agent: t.assignee || (NOL.sync.cfg && NOL.sync.cfg.user) || '', company: c ? c.name : '' };
  return String(text || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => k in v ? v[k] : m); // an unknown name stays visible, so a typo is obvious
}
function macrosDialog(edit) {
  const m = edit || {}, list = store.all('macros').sort((a, b) => a.name.localeCompare(b.name));
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries()); const rec = { name: v.name.trim() || 'Macro', body: v.body, status: v.status }; m.id ? store.update('macros', m.id, rec) : store.add('macros', rec); toast('Macro saved.'); macrosDialog(); } },
    h('h3', {}, 'Canned replies'),
    h('p', { class: 'mute' }, 'A macro fills the reply box in one click and can move the ticket on. Variables: {{requester}}, {{first}}, {{subject}}, {{agent}}, {{company}}.'),
    list.length ? h('div', { class: 'stack', style: 'margin:14px 0' }, list.map(x => h('div', { class: 'macro' },
      h('div', { class: 'row between' }, h('b', {}, x.name),
        h('span', { class: 'row' }, x.status ? badge(x.status) : null,
          h('button', { type: 'button', class: 'btn sm ghost', onclick: () => macrosDialog(x) }, 'Edit'),
          h('button', { type: 'button', class: 'btn sm ghost danger', onclick: () => { if (confirm(NOL.t('Delete macro?'))) { store.remove('macros', x.id); macrosDialog(); } } }, 'Delete'))),
      h('p', { class: 'mute' }, x.body))))
      : h('p', { class: 'mute', style: 'margin:14px 0' }, 'No macros yet. The one you add here appears in every ticket.'),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Name'), h('input', { class: 'input', name: 'name', value: m.name || '', required: true })),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Reply'), h('textarea', { class: 'input', name: 'body', style: 'font-family:var(--font);font-size:15px;min-height:110px' }, m.body || '')),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Also set status'), h('select', { class: 'input', name: 'status' }, h('option', { value: '' }, 'Leave unchanged'), STATUSES.map(s => h('option', { value: s, selected: s === m.status }, s)))),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn ghost', onclick: () => edit ? macrosDialog() : dlg.close() }, edit ? 'Cancel' : 'Close'),
      h('button', { class: 'btn acid' }, edit ? 'Save macro' : 'Add macro'))));
  if (!dlg.open) dlg.showModal();
}

/* ---------- merge: the duplicate moves its thread into the real ticket and goes to Trash ---------- */
function mergeInto(src, dst) {
  const msgs = [...(dst.messages || []), ...(src.messages || [])].sort((a, b) => String(a.t || '').localeCompare(String(b.t || '')));
  msgs.push({ from: 'note', text: 'Merged from “' + src.subject + '”', t: NOL.now() });
  for (const c of ['files', 'notes']) for (const r of store.all(c).filter(r => r.coll === 'tickets' && r.ref === src.id)) store.update(c, r.id, { ref: dst.id });
  store.update('tickets', dst.id, { messages: msgs, companyId: dst.companyId || src.companyId || '' });
  store.remove('tickets', src.id); // tombstone: Trash restores it, with the thread still in the merged ticket
  openTicket(dst.id); dlg.close(); render(); toast('Merged.');
}
function mergeDialog(t) {
  let mq = '';
  const list = h('div', { class: 'stack' });
  const same = x => ((x.email && x.email === t.email) || (x.requester && x.requester === t.requester)) ? 1 : 0;
  function paint() {
    const rows = store.all('tickets').filter(x => x.id !== t.id && (!mq || JSON.stringify(x).toLowerCase().includes(mq)))
      .sort((a, b) => same(b) - same(a) || String(b.updated || b.created || '').localeCompare(String(a.updated || a.created || ''))).slice(0, 20);
    list.replaceChildren(rows.length ? h('div', { class: 'stack' }, rows.map(x => h('button', { type: 'button', class: 'pickt', onclick: () => { if (confirm(NOL.t(`Merge “${t.subject}” into “${x.subject}”? Messages and files move over and this ticket goes to Trash.`))) mergeInto(t, x); } },
      h('div', { class: 'row between' }, h('b', {}, x.subject), badge(x.status)),
      h('div', { class: 'mute', style: 'font-size:13px' }, `${x.requester || '—'} · ${fmtDate(x.updated || x.created)}`))))
      : h('p', { class: 'mute' }, 'No other ticket matches.'));
  }
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => e.preventDefault() },
    h('h3', {}, 'Merge this ticket into…'),
    h('p', { class: 'mute', style: 'margin-bottom:12px' }, 'Messages and files move to the ticket you pick. This one goes to Trash, where it can be restored.'),
    h('input', { class: 'input', placeholder: 'Search tickets…', style: 'margin-bottom:12px', oninput: e => { mq = e.target.value.toLowerCase(); paint(); } }),
    list,
    h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'))));
  paint(); dlg.showModal();
}

function render() {
  const all = store.all('tickets'), mine = all.filter(matchWho);
  const counts = Object.fromEntries(STATUSES.map(s => [s, mine.filter(t => t.status === s).length]));
  counts.breached = mine.filter(isLate).length;
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'Desk'), h('p', { class: 'mute' }, `${counts.open} open · ${counts.pending} pending · ${counts.solved} solved`, counts.breached ? [' · ', h('span', { class: 'badge red' }, counts.breached + ' SLA breached')] : null)),
      h('div', { class: 'toolbar' },
        h('input', { class: 'input', placeholder: 'Search…', value: q, oninput: e => { q = e.target.value.toLowerCase(); draw(); } }),
        h('select', { class: 'input', style: 'width:auto', title: 'Assignee', onchange: e => { who = e.target.value; render(); } },
          h('option', { value: '' }, 'All assignees'), h('option', { value: '!', selected: who === '!' }, 'Unassigned'),
          [...new Set([...agents(), ...all.map(t => t.assignee)].filter(Boolean))].sort().map(a => h('option', { value: a, selected: a === who }, a))),
        h('button', { class: 'btn ghost', onclick: () => macrosDialog() }, 'Macros'),
        h('button', { class: 'btn ghost', onclick: () => slaDialog() }, 'SLA'),
        h('button', { class: 'btn', onclick: importCSV }, 'Import CSV'),
        h('button', { class: 'btn ghost', onclick: () => download('tickets.csv', toCSV(all.map(t => ({ ...t, messages: t.messages.length, sla: slaWord(t), company: (companyOf(t) || {}).name || '' })), ['subject', 'status', 'priority', 'requester', 'email', 'assignee', 'company', 'sla', 'created', 'updated', 'messages']), 'text/csv') }, 'Export CSV'),
        h('button', { class: 'btn acid', onclick: newTicket }, '+ Ticket'))),
    h('div', { class: 'row', style: 'margin-bottom:16px' }, ['open', 'pending', 'solved', 'breached', 'all'].map(s => h('button', { class: 'btn sm' + (s === filter ? ' acid' : ' ghost'), onclick: () => { filter = s; draw(); } }, s[0].toUpperCase() + s.slice(1), s !== 'all' && h('span', { class: 'mono dim' }, counts[s])))),
    h('div', { id: 'body' }));
  draw();
}
const matchWho = t => !who || (who === '!' ? !t.assignee : t.assignee === who);
const matchFilter = t => filter === 'all' || (filter === 'breached' ? isLate(t) : t.status === filter);
function draw() {
  const body = document.getElementById('body');
  const t = openId && store.get('tickets', openId);
  if (t) return body.replaceChildren(ticketView(t));
  const rows = store.all('tickets').filter(x => matchWho(x) && matchFilter(x) && (!q || JSON.stringify(x).toLowerCase().includes(q))).sort((a, b) => (b.updated || b.created).localeCompare(a.updated || a.created));
  body.replaceChildren(rows.length ? h('div', { class: 'card pad0' }, h('table', { class: 'table' }, h('thead', {}, h('tr', {}, ['Subject', 'Requester', 'Status', 'Priority', 'Assignee', 'SLA', 'Updated'].map(x => h('th', {}, x)))),
    h('tbody', {}, rows.map(x => h('tr', { class: 'click' + (isLate(x) ? ' late' : ''), onclick: () => { openTicket(x.id); draw(); } }, h('td', {}, h('b', {}, x.subject)), h('td', { class: 'mute' }, x.requester), h('td', {}, badge(x.status)), h('td', {}, pbadge(x.priority)), h('td', { class: 'mute' }, x.assignee || '—'), h('td', {}, slaCell(x)), h('td', { class: 'mute' }, fmtDate(x.updated || x.created)))))))
    : empty(filter === 'open' ? 'Inbox zero' : filter === 'breached' ? 'No SLA breaches' : 'Nothing here', filter === 'breached' ? 'Every ticket is inside its target. Change the targets under SLA.' : 'Import a Zendesk or Freshdesk CSV, or open a ticket by hand.'));
}
function ticketView(t) {
  const comp = companyOf(t), macros = store.all('macros').sort((a, b) => a.name.localeCompare(b.name));
  const box = h('textarea', { class: 'input', placeholder: 'Write a reply… (Markdown ok)', style: 'font-family:var(--font);font-size:15px;min-height:90px', oninput: e => reply = e.target.value }, reply); // kept in `reply`, so changing status or applying a macro never wipes what is typed
  const note = h('input', { type: 'checkbox' });
  const send = () => { if (!box.value.trim()) return; t.messages.push({ from: note.checked ? 'note' : 'agent', text: box.value.trim(), t: NOL.now() }); store.update('tickets', t.id, { messages: t.messages }); reply = ''; };
  const applyMacro = e => {
    const m = store.get('macros', e.target.value); e.target.value = ''; if (!m) return;
    reply = (box.value.trim() ? box.value.replace(/\s*$/, '\n\n') : '') + fillVars(m.body, t); box.value = reply; box.focus();
    if (m.status && m.status !== t.status) { setStatus(t, m.status); render(); }
  };
  return h('div', { class: 'stack' },
    h('div', { class: 'row between' },
      h('button', { class: 'btn sm ghost', onclick: () => { openTicket(null); draw(); } }, '← Back'),
      h('div', { class: 'row' },
        h('select', { class: 'input', style: 'width:auto', onchange: e => { setStatus(t, e.target.value); render(); } }, STATUSES.map(s => h('option', { value: s, selected: s === t.status }, s))),
        h('select', { class: 'input', style: 'width:auto', onchange: e => { store.update('tickets', t.id, { priority: e.target.value }); draw(); } }, PRIOS.map(p => h('option', { value: p, selected: p === t.priority }, p))),
        h('select', { class: 'input', style: 'width:auto', onchange: e => { store.update('tickets', t.id, { assignee: e.target.value }); render(); } }, h('option', { value: '' }, 'Unassigned'), [...new Set([...agents(), t.assignee].filter(Boolean))].map(a => h('option', { value: a, selected: a === t.assignee }, a))),
        h('select', { class: 'input', style: 'width:auto', title: 'Company', onchange: e => { store.update('tickets', t.id, { companyId: e.target.value }); draw(); } }, h('option', { value: '' }, 'No company'), companies().map(c => h('option', { value: c.id, selected: comp && c.id === comp.id }, c.name))),
        h('button', { class: 'btn sm ghost', onclick: () => mergeDialog(t) }, 'Merge'),
        h('button', { class: 'btn sm ghost danger', onclick: () => { if (confirm(NOL.t('Delete ticket?'))) { store.remove('tickets', t.id); openTicket(null); render(); } } }, 'Delete'))),
    h('div', { class: 'card' },
      h('h3', {}, t.subject),
      h('p', { class: 'mute', style: 'margin-bottom:16px' }, `${t.requester}${t.email ? ' · ' + t.email : ''} · opened ${fmtDate(t.created)}`, comp && [' · ', h('a', { class: 'acid', href: 'company-page.html?id=' + comp.id }, comp.name)], ' ', slaCell(t)),
      t.messages.map(m => h('div', { class: 'msg ' + m.from }, h('div', { class: 'who' }, m.from === 'note' ? 'Internal note' : m.from === 'agent' ? 'You' : t.requester, ' · ', new Date(m.t).toLocaleString()), m.text)),
      h('div', { class: 'stack', style: 'margin-top:16px' },
        macros.length ? h('div', { class: 'row' },
          h('select', { class: 'input', style: 'width:auto', onchange: applyMacro }, h('option', { value: '' }, 'Apply macro…'), macros.map(m => h('option', { value: m.id }, m.name))),
          h('button', { class: 'btn sm ghost', onclick: () => macrosDialog() }, 'Edit macros')) : null,
        box,
        h('div', { class: 'row between' }, h('label', { class: 'row mute' }, note, ' internal note'),
          h('div', { class: 'row' },
            h('button', { class: 'btn', onclick: () => { send(); draw(); } }, 'Send'),
            h('button', { class: 'btn acid', onclick: () => { send(); setStatus(t, 'solved'); openTicket(null); render(); toast('Solved.'); } }, 'Send & solve'))))),
    h('div', { class: 'card' }, NOL.filesPanel('tickets', t.id)));
}
function newTicket() {
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries()); ensureContact(v.requester, v.email); const t = store.add('tickets', { subject: v.subject.trim() || 'No subject', requester: v.requester.trim() || 'Unknown', email: v.email, companyId: v.companyId, status: 'open', priority: v.priority, assignee: '', messages: v.desc.trim() ? [{ from: 'requester', text: v.desc.trim(), t: NOL.now() }] : [] }); dlg.close(); openTicket(t.id); render(); } },
    h('h3', {}, 'New ticket'),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Subject'), h('input', { class: 'input', name: 'subject', required: true })),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Requester'), h('input', { class: 'input', name: 'requester' })),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Email'), h('input', { class: 'input', name: 'email', type: 'email' })),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Company'), h('select', { class: 'input', name: 'companyId' }, h('option', { value: '' }, 'No company'), companies().map(c => h('option', { value: c.id }, c.name)))),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Priority'), h('select', { class: 'input', name: 'priority' }, PRIOS.map(p => h('option', { value: p, selected: p === 'normal' }, p)))),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Message'), h('textarea', { class: 'input', name: 'desc', style: 'font-family:var(--font);font-size:15px' })),
    h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'), h('button', { class: 'btn acid' }, 'Open ticket'))));
  dlg.showModal();
}
async function importCSV() {
  const files = await pickFile('.csv,text/csv', true); let n = 0;
  for (const f of files) {
    const { headers, rows } = csvToObjects(await readFile(f)); const m = mapHeaders(headers, SPEC); if (!m.subject) { toast(`${f.name}: no subject column found.`); continue; }
    store.addMany('tickets', rows.map(r => { const created = pick(r, m, 'created'); const d = created && !isNaN(Date.parse(created)) ? new Date(created).toISOString() : NOL.now(); const desc = pick(r, m, 'desc'); ensureContact(pick(r, m, 'requester'), pick(r, m, 'email')); const status = normStatus(pick(r, m, 'status'));
      return { subject: pick(r, m, 'subject') || 'No subject', requester: pick(r, m, 'requester') || pick(r, m, 'email') || 'Unknown', email: pick(r, m, 'email'), status, solvedAt: status === 'solved' ? d : '', priority: normPrio(pick(r, m, 'priority')), assignee: pick(r, m, 'assignee'), tags: pick(r, m, 'tags'), created: d, updated: d, messages: desc ? [{ from: 'requester', text: desc, t: d }] : [] }; }));
    n += rows.length;
  }
  if (files.length) { toast(`Imported ${n} tickets.`); filter = 'all'; render(); }
}
addEventListener("nol:change", () => render());
render();
</script></body></html>
