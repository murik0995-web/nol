<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Contracts · free contract management</title>
<meta name="description" content="Contract templates with placeholders, filled from your CRM companies and contacts. Renewal and notice dates with reminders, statuses, print-to-PDF. Free, open source, runs in your browser. Imports PandaDoc, Concord, ContractSafe, Juro and DocuSign CLM CSV exports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css">
<style>
.paper{background:#fff;color:#16161a;border-radius:var(--r);padding:44px 48px;max-width:820px;margin:0 auto}
.paper .h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.paper .grey{color:#71717a}
.paper .pre{white-space:pre-wrap;line-height:1.45}
.paper .body{line-height:1.6;font-size:15px}
.paper .body h1{font-size:22px;margin:22px 0 8px}
.paper .body h2{font-size:18px;margin:20px 0 8px}
.paper .body h3{font-size:15px;margin:18px 0 6px}
.paper .body p{margin:8px 0}
.paper .body ul,.paper .body ol{margin:8px 0;padding-left:22px}
.paper .body li{margin:3px 0}
.paper .body blockquote{border-left:3px solid #e4e4e8;padding-left:12px;color:#52525b;margin:10px 0}
.paper .body hr{border:none;border-top:1px solid #e4e4e8;margin:18px 0}
.ph{background:#fff3bf;border-radius:4px;padding:0 3px;font-family:var(--mono);font-size:13px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:34px;border-top:1px solid #e4e4e8;padding-top:22px}
.sign .ln{border-bottom:1px solid #16161a;height:34px;margin-bottom:6px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tpl p{white-space:pre-wrap;font-size:13px;margin-top:6px}
.late{color:var(--red)}
@media print{
  body{background:#fff}
  .top,.noprint,.toast,dialog{display:none!important}
  .app{padding:0}
  .paper{max-width:none;border-radius:0;padding:0}
}
</style></head><body>
<main class="wrap app" id="app"></main>
<dialog id="dlg"></dialog>
<script src="../assets/nol.js"></script>
<script>
const { store, h, toast, fmtDate, pickFile, readFile, csvToObjects, mapHeaders, pick, toCSV, download, empty, md, fillVars, varsIn, noticeDate, contractDue } = NOL;
NOL.topbar('contracts');
const SPEC = {

  contact: ['signer', 'signatory', 'recipient', 'contact name', 'primary contact', 'contact'],

  start: ['effective date', 'commencement date', 'start date', 'signed date', 'date signed', 'effective', 'start'],
  end: ['expiration date', 'expiry date', 'termination date', 'end date', 'expires on', 'expiration', 'expiry', 'expires'],
  notice: ['notice period', 'notice days', 'notice period (days)', 'cancellation notice', 'termination notice', 'notice'],
  renew: ['auto renew', 'auto-renew', 'autorenew', 'automatic renewal', 'renewal type', 'evergreen', 'renewal'],

const STATUSES = ['draft', 'sent', 'signed', 'terminated'];
const VARS = ['company', 'contact', 'email', 'phone', 'role', 'contract', 'start', 'end', 'value', 'notice', 'owner', 'us', 'today'];

function varsOf(c) {
  const p = contactOf(c);

}
const missingVars = c => { const v = varsOf(c); return varsIn(c.body).filter(k => !(k in v) || v[k] === ''); };

          h('span', { 'data-notranslate': true }, money(value)), ' ', h('span', {}, 'under contract'),

      h('button', { class: 'btn sm' + (filter === f ? ' acid' : ' ghost'), onclick: () => { filter = f; render(); } }, n))),
    soon.length ? remindersCard(soon) : null,

}

}

    h('tbody', {}, vis.map(c => {

        h('td', { class: 'mute' }, fmtDate(c.start)),
        h('td', { class: isExpired(c) ? 'late' : 'mute' }, fmtDate(c.end)),
        h('td', { class: kind === 'notice' ? 'late' : 'mute' }, n ? fmtDate(n) : '—'),

    }))));
}
const LBL = 'font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px';

    h('div', { class: 'paper stack' },

        h('div', {}, h('div', { class: 'h1', 'data-notranslate': true }, c.title || 'Contract'),

        h('div', {}, h('span', { class: 'grey' }, 'Start '), h('b', { 'data-notranslate': true }, fmtDate(c.start) || '—')),
        h('div', {}, h('span', { class: 'grey' }, 'End '), h('b', { 'data-notranslate': true }, fmtDate(c.end) || '—')),
        +c.noticeDays ? h('div', {}, h('span', { class: 'grey' }, 'Notice '), h('b', {}, +c.noticeDays + ' days')) : null,
        +c.value ? h('div', {}, h('span', { class: 'grey' }, 'Value '), h('b', { 'data-notranslate': true }, money(c.value))) : null),
      c.body ? h('div', { class: 'body', 'data-notranslate': true, html }) : h('p', { class: 'grey' }, 'No text yet. Edit this contract and pick a template.'),
      h('div', { class: 'sign' },

        h('div', {}, h('div', { class: 'ln' }), h('div', { class: 'grey', style: 'font-size:13px' }, h('span', { 'data-notranslate': true }, companyName(c.counterpartyId) || ''), h('br'), h('span', {}, 'Name, position, date'))))),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.filesPanel('contracts', c.id)),
    h('div', { class: 'card noprint', style: 'max-width:820px;margin:16px auto 0' }, NOL.notesPanel('contracts', c.id))].filter(Boolean);
}
function edit(c = {}) {
  const tpls = store.all('templates').sort((a, b) => a.name.localeCompare(b.name));
  const bodyBox = h('textarea', { class: 'input', name: 'body', style: 'font-family:var(--mono);font-size:13px;min-height:200px', placeholder: 'The text of the contract. Markdown works, {{company}} and the other placeholders are filled from CRM.' }, c.body || '');

  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries());
    const rec = { title: v.title.trim() || 'Contract', counterpartyId: ensureCompany(v.company), contactId: (contactByName(v.contact) || {}).id || '', status: v.status,

  } },
    h('h3', {}, c.id ? 'Edit contract' : 'New contract'),
    h('div', { class: 'grid g2' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Title'), h('input', { class: 'input', name: 'title', value: c.title || '', placeholder: 'Services agreement', autofocus: true })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Counterparty'), h('input', { class: 'input', name: 'company', list: 'cc', value: companyName(c.counterpartyId), placeholder: 'Company from CRM or a new one' }), h('datalist', { id: 'cc' }, store.all('companies').map(x => h('option', { value: x.name })))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Signatory'), h('input', { class: 'input', name: 'contact', list: 'pp', value: contactOf(c).name || '', placeholder: 'Contact from CRM' }), h('datalist', { id: 'pp' }, store.all('contacts').map(x => h('option', { value: x.name })))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Owner'), h('input', { class: 'input', name: 'owner', list: 'ow', value: c.owner || '', placeholder: 'Who watches this one' }), h('datalist', { id: 'ow' }, store.all('people').map(x => h('option', { value: x.name })))),

      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Start'), h('input', { class: 'input', name: 'start', type: 'date', value: c.start || today() })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'End'), h('input', { class: 'input', name: 'end', type: 'date', value: c.end || '' })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Notice, days'), h('input', { class: 'input', name: 'noticeDays', type: 'number', min: 0, step: 1, value: c.noticeDays ?? 30 })),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Renewal'), h('label', { class: 'row', style: 'gap:8px;align-items:center;height:38px' }, h('input', { type: 'checkbox', name: 'autoRenew', checked: !!c.autoRenew }), h('span', {}, 'Renews itself unless notice is given')))),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Your side of the contract'),
      h('textarea', { class: 'input', name: 'party', style: 'font-family:var(--font);font-size:14px;min-height:64px', placeholder: 'Acme LLC\n1 Main St\nlegal@acme.io' }, c.party ?? last('party'))),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Text'),
      tpls.length ? h('div', { class: 'row', style: 'margin-bottom:8px' },

        h('button', { type: 'button', class: 'btn sm ghost', onclick: () => templatesDialog() }, 'Edit templates'))

}

}
const numval = s => { const v = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return isNaN(v) ? 0 : v; };
const isoDate = v => { const t = Date.parse(v); return isNaN(t) ? '' : new Date(t).toISOString().slice(0, 10); };
const normStatus = s => /terminat|cancel|void|declin/i.test(s) ? 'terminated' : /signed|executed|complet|expir|active|live|counter/i.test(s) ? 'signed' : /sent|pending|review|await|out for|negotiat|signature|delivered|viewed/i.test(s) ? 'sent' : 'draft'; // "out for signature" is not signed, however much of the word it shares
const isAuto = s => /auto|evergreen|yes|true|renew/i.test(String(s)) && !/no auto|manual|none|no renew/i.test(String(s));
async function importCSV() {
  const files = await pickFile('.csv,text/csv', true); let n = 0;
  for (const f of files) {
    const { headers, rows } = csvToObjects(await readFile(f)); if (!rows.length) continue;
    const m = mapHeaders(headers, SPEC);
    if (!m.title && !m.company) { toast(`${f.name}: no contract name or counterparty column found.`); continue; }
    for (const r of rows) {
      const title = pick(r, m, 'title') || pick(r, m, 'company') || 'Contract';
      const person = contactByName(pick(r, m, 'contact'));
      store.add('contracts', { title, counterpartyId: ensureCompany(pick(r, m, 'company')), contactId: person ? person.id : '',
        status: m.status ? normStatus(pick(r, m, 'status')) : 'signed', start: isoDate(pick(r, m, 'start')), end: isoDate(pick(r, m, 'end')),
        noticeDays: m.notice ? Math.round(numval(pick(r, m, 'notice'))) : 0, autoRenew: m.renew ? isAuto(pick(r, m, 'renew')) : false,
        value: m.value ? numval(pick(r, m, 'value')) : 0, owner: pick(r, m, 'owner'), party: '', body: '', notes: pick(r, m, 'notes') });
      n++;
    }
  }
  if (files.length) { toast(`Imported ${n} contracts.`); filter = ''; render(); }
}
function exportCSV() {
  const rows = store.all('contracts').map(c => ({ title: c.title, counterparty: companyName(c.counterpartyId), signatory: contactOf(c).name || '', status: c.status || 'draft',
    'start date': c.start || '', 'end date': c.end || '', 'notice days': +c.noticeDays || 0, 'notice date': noticeDate(c), 'auto renew': c.autoRenew ? 'yes' : 'no',
    value: +c.value || 0, owner: c.owner || '', notes: c.notes || '' }));
  download('contracts.csv', toCSV(rows, ['title', 'counterparty', 'signatory', 'status', 'start date', 'end date', 'notice days', 'notice date', 'auto renew', 'value', 'owner', 'notes']), 'text/csv');
}
addEventListener("nol:change", () => render());
render();
</script></body></html>
