<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Time · free time tracking</title>
<meta name="description" content="Start/stop timer, manual entries, a weekly timesheet grid and per-person totals. Free, open source, runs in your browser. Imports Toggl Track, Harvest, Clockify, TimeCamp CSV exports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css?v=mtpezvpz">
<style>.wk td,.wk th{white-space:nowrap}.wk td.num{cursor:pointer}.wk .tdy{color:var(--acid)}</style></head><body>
<main class="wrap app" id="app"></main>
<dialog id="dlg"></dialog>
<script src="../assets/nol.js?v=mtpezvpz"></script>
<script>
const { store, h, toast, fmtDate, fmtDur, parseDuration, pickFile, readFile, csvToObjects, mapHeaders, pick, toCSV, download, empty, bars, who } = NOL;
NOL.topbar('timesheets');
const SPEC = {
  person: ['user', 'person', 'member', 'employee', 'user name', 'full name', 'team member'],
  first: ['first name'], last: ['last name'],
  project: ['project', 'project name'],
  task: ['task', 'task name', 'activity'],
  note: ['description', 'note', 'notes', 'details', 'comment'],
  date: ['start date', 'date', 'work date', 'day'],
  duration: ['duration', 'hours', 'duration (h)', 'duration (decimal)', 'time', 'time spent', 'logged'],
};
let mode = 'week', off = 0, q = '';
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const week = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7 + off * 7); return Array.from({ length: 7 }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return iso(x); }); };
const locale = () => NOL.lang() === 'ru' ? 'ru-RU' : 'en-US';
const running = () => store.all('timelogs').find(x => x.running);
const clock = start => { const s = Math.max(0, Math.floor((Date.now() - Date.parse(start)) / 1000)); return Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const people = () => [...new Set([...store.all('people').map(p => p.name), ...store.all('timelogs').map(x => x.person)].filter(Boolean))].sort();
const projects = () => [...new Set([...store.all('tasks').map(t => t.project), ...store.all('timelogs').map(x => x.project)].filter(Boolean))].sort();

function render() {
  const all = store.all('timelogs');
  const vis = all.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
  const days = week();
  const wk = vis.filter(x => !x.running && x.date >= days[0] && x.date <= days[6]);
  const wkMin = wk.reduce((s, x) => s + (+x.minutes || 0), 0);
  const r = running();
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'Time'), h('p', { class: 'mute' }, `${fmtDur(wkMin)} this week · ${wk.length} entries`)),
      h('div', { class: 'toolbar' },
        h('input', { class: 'input', placeholder: 'Search…', value: q, oninput: e => { q = e.target.value.toLowerCase(); render(); } }),
        r ? h('button', { id: 'tick', class: 'btn', style: 'color:var(--ok);font-family:var(--mono)', title: 'Stop the timer and log the time', onclick: stopTimer }, '■ ' + clock(r.start))
          : h('button', { class: 'btn', onclick: startTimer }, '▶ ', 'Start timer'),
        h('button', { class: 'btn', onclick: importFiles }, 'Import CSV'),
        h('button', { class: 'btn ghost', onclick: () => download('timesheet.csv', toCSV(all.filter(x => !x.running).map(x => ({ ...x, duration: fmtDur(x.minutes) })), ['date', 'person', 'project', 'note', 'duration']), 'text/csv') }, 'Export CSV'),
        h('button', { class: 'btn acid', onclick: () => edit() }, '+ Entry'))),
    h('div', { class: 'row between', style: 'margin-bottom:16px' },
      h('div', { class: 'row' }, [['week', 'Week'], ['list', 'List']].map(([m, n]) => h('button', { class: 'btn sm' + (m === mode ? ' acid' : ' ghost'), onclick: () => { mode = m; render(); } }, n))),
      mode === 'week' && h('div', { class: 'row' },
        h('button', { class: 'btn sm ghost', onclick: () => { off--; render(); } }, '←'),
        h('span', { class: 'mute', style: 'font-size:13px' }, fmtDate(days[0]) + ' – ' + fmtDate(days[6])),
        h('button', { class: 'btn sm ghost', onclick: () => { off++; render(); } }, '→'),
        off !== 0 && h('button', { class: 'btn sm ghost', onclick: () => { off = 0; render(); } }, 'This week'))),
    body(vis, wk, days));
}
function body(vis, wk, days) {
  if (!vis.length && !q) return empty('No time tracked yet', 'Import a Toggl Track, Harvest or Clockify CSV. Or start the timer.');
  return mode === 'list' ? list(vis) : grid(wk, days);
}
function grid(wk, days) {
  const t0 = today();
  const rows = new Map();
  for (const x of wk) {
    const k = (x.person || '') + '\u001f' + (x.project || ''); // unit separator, written as an escape so the file stays text
    if (!rows.has(k)) rows.set(k, { person: x.person || '', project: x.project || '', days: Array(7).fill(0), total: 0 });
    const r = rows.get(k), di = days.indexOf(x.date);
    if (di >= 0) { r.days[di] += +x.minutes || 0; r.total += +x.minutes || 0; }
  }
  const sorted = [...rows.values()].sort((a, b) => a.person.localeCompare(b.person) || a.project.localeCompare(b.project));
  const dayTot = days.map((_, i) => sorted.reduce((s, r) => s + r.days[i], 0));
  const dayHead = d => new Date(d + 'T12:00:00').toLocaleDateString(locale(), { weekday: 'short', day: 'numeric' });
  const cellClick = (r, date) => {
    const es = store.all('timelogs').filter(x => !x.running && x.date === date && (x.person || '') === r.person && (x.project || '') === r.project);
    es.length === 1 ? edit(es[0]) : edit({ person: r.person, project: r.project, date });
  };
  return h('div', {},
    h('div', { class: 'card pad0', style: 'overflow-x:auto' }, h('table', { class: 'table wk' },
      h('thead', {}, h('tr', {}, h('th', {}, 'Person'), h('th', {}, 'Project'), days.map(d => h('th', { class: 'num' + (d === t0 ? ' tdy' : '') }, dayHead(d))), h('th', { class: 'num' }, 'Total'))),
      h('tbody', {},
        sorted.map(r => h('tr', {},
          h('td', {}, r.person ? who(r.person) : h('span', { class: 'mute' }, '—')),
          h('td', { class: 'mute' }, r.project || '—'),
          days.map((d, i) => h('td', { class: 'num' + (d === t0 ? ' tdy' : ''), onclick: () => cellClick(r, d) }, r.days[i] ? fmtDur(r.days[i]) : '')),
          h('td', { class: 'num' }, h('b', {}, fmtDur(r.total))))),
        h('tr', {}, h('td', {}), h('td', { class: 'mute' }, 'Total'), dayTot.map(v => h('td', { class: 'num' }, v ? h('b', {}, fmtDur(v)) : '')), h('td', { class: 'num' }, h('b', {}, fmtDur(dayTot.reduce((a, b) => a + b, 0)))))))),
    perPerson(wk));
}
function perPerson(wk) {
  const per = {};
  for (const x of wk) { const k = x.person || '—'; per[k] = (per[k] || 0) + (+x.minutes || 0); }
  const items = Object.entries(per).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));
  return items.length ? h('div', { class: 'card', style: 'margin-top:16px;max-width:520px' }, h('h3', { class: 'h' }, 'Per person, this week'), bars(items, fmtDur)) : null;
}
function list(vis) {
  const rows = [...vis].sort((a, b) => (b.running ? 1 : 0) - (a.running ? 1 : 0) || (b.date || '').localeCompare(a.date || '') || (b.created || '').localeCompare(a.created || ''));
  return h('div', { class: 'card pad0' }, h('table', { class: 'table' },
    h('thead', {}, h('tr', {}, ['Date', 'Person', 'Project', 'Note', 'Duration'].map(x => h('th', {}, x)))),
    h('tbody', {}, rows.map(x => h('tr', { class: 'click', onclick: () => edit(x) },
      h('td', { class: 'mute' }, fmtDate(x.date)),
      h('td', {}, x.person ? who(x.person) : h('span', { class: 'mute' }, '—')),
      h('td', { class: 'mute' }, x.project),
      h('td', {}, x.note),
      h('td', { class: 'num' }, x.running ? h('span', { class: 'badge ok' }, 'running') : fmtDur(x.minutes)))))));
}
function startTimer() {
  const r = store.add('timelogs', { person: '', project: '', note: '', date: today(), start: NOL.now(), minutes: 0, running: true });
  toast('Timer started.'); render(); edit(r);
}
function stopTimer() {
  const r = running(); if (!r) return;
  const min = Math.max(1, Math.round((Date.now() - Date.parse(r.start)) / 60000));
  store.update('timelogs', r.id, { running: false, minutes: min, date: r.start.slice(0, 10) });
  toast(`Logged ${fmtDur(min)}.`); render();
}
setInterval(() => { const r = running(), b = document.getElementById('tick'); if (r && b) b.textContent = '■ ' + clock(r.start); }, 1000);
function edit(t = {}) {
  const run = !!t.running;
  const vals = f => { const v = Object.fromEntries(new FormData(f).entries()); v.person = v.person.trim(); v.project = v.project.trim(); v.note = v.note.trim(); if (!run) { v.minutes = parseDuration(v.duration) || 0; delete v.duration; if (!v.date) v.date = today(); } return v; };
  const save = v => { t.id ? store.update('timelogs', t.id, v) : store.add('timelogs', v); };
  const form = h('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); save(vals(e.target)); dlg.close(); render(); } },
    h('h3', {}, run ? 'Timer' : t.id ? 'Edit entry' : 'New entry'),
    h('div', { class: 'grid g2' },
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Person'), h('input', { class: 'input', name: 'person', list: 'pp', value: t.person || '', placeholder: 'Person from People' }), h('datalist', { id: 'pp' }, people().map(s => h('option', { value: s })))),
      h('div', { class: 'field' }, h('label', { class: 'f' }, 'Project'), h('input', { class: 'input', name: 'project', list: 'pj', value: t.project || '' }), h('datalist', { id: 'pj' }, projects().map(s => h('option', { value: s })))),
      !run && h('div', { class: 'field' }, h('label', { class: 'f' }, 'Date'), h('input', { class: 'input', name: 'date', type: 'date', value: t.date || today() })),
      !run && h('div', { class: 'field' }, h('label', { class: 'f' }, 'Duration'), h('input', { class: 'input', name: 'duration', placeholder: '1:30 or 1.5h', required: true, value: t.id ? fmtDur(t.minutes) : '' }))),
    h('div', { class: 'field' }, h('label', { class: 'f' }, 'Note'), h('input', { class: 'input', name: 'note', value: t.note || '', placeholder: 'What did you work on?' })),
    h('div', { class: 'actions' },
      t.id && h('button', { type: 'button', class: 'btn ghost danger', onclick: () => { if (confirm(NOL.t('Delete entry?'))) { store.remove('timelogs', t.id); dlg.close(); render(); } } }, 'Delete'),
      h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'),
      run && h('button', { type: 'button', class: 'btn acid', onclick: () => { save(vals(form)); dlg.close(); stopTimer(); } }, 'Stop timer'),
      h('button', { class: 'btn' + (run ? ' ghost' : ' acid') }, 'Save')));
  dlg.replaceChildren(form); dlg.showModal();
}
async function importFiles() {
  const files = await pickFile('.csv,text/csv', true); let n = 0;
  for (const f of files) {
    const { headers, rows } = csvToObjects(await readFile(f)); const m = mapHeaders(headers, SPEC);
    if (!m.duration) { toast(`${f.name}: no duration column found.`); continue; }
    const add = rows.map(r => {
      const min = parseDuration(pick(r, m, 'duration')); if (!min) return null;
      const d = pick(r, m, 'date');
      return { person: pick(r, m, 'person') || [pick(r, m, 'first'), pick(r, m, 'last')].filter(Boolean).join(' '), project: pick(r, m, 'project'), note: [pick(r, m, 'task'), pick(r, m, 'note')].filter(Boolean).join(' — '), date: d && !isNaN(Date.parse(d)) ? new Date(Date.parse(d) + 43200000).toISOString().slice(0, 10) : today(), minutes: min };
    }).filter(Boolean);
    store.addMany('timelogs', add); n += add.length;
  }
  if (files.length) { toast(`Imported ${n} time entries.`); off = 0; render(); }
}
addEventListener("nol:change", () => render());
render();
</script></body></html>
