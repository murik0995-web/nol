<script>
const { store, h, esc, toast, fmtDate, pickFile, readFile, csvToObjects, mapHeaders, pick, fullName, toCSV, download, empty, tile, bars, svg, timeline, dupGroups } = NOL;
NOL.topbar('crm');
const STAGES = ['Lead', 'Qualified', 'Proposal', 'Won', 'Lost'];
const CONTACT_SPEC = { name: ['name', 'full name', 'contact name', 'person', 'person - name', 'contact'], first: ['first name', 'firstname', 'given name'], last: ['last name', 'lastname', 'surname', 'family name'], email: ['email', 'e-mail', 'email address', 'person - email', 'work email', 'primary email'], phone: ['phone', 'phone number', 'mobile', 'person - phone', 'mobile phone'], company: ['company', 'company name', 'organization', 'organisation', 'account name', 'account', 'organization - name', 'person - organization'], title: ['job title', 'title', 'position', 'role'], owner: ['owner', 'contact owner', 'assigned to'] };
const DEAL_SPEC = { name: ['deal name', 'deal', 'opportunity name', 'deal - title', 'opportunity', 'name', 'title'], amount: ['amount', 'value', 'deal value', 'deal - value', 'revenue', 'price'], stage: ['stage', 'deal stage', 'pipeline stage', 'deal - stage', 'status'], company: ['company', 'associated company', 'account name', 'organization', 'organization - name', 'deal - organization'], contact: ['contact', 'associated contact', 'person', 'person - name', 'contact name'], close: ['close date', 'expected close date', 'closing date', 'deal - expected close date'], owner: ['owner', 'deal owner', 'assigned to'] };
const VIEWS = ['contacts', 'deals', 'companies', 'reports'];
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'contacts', q = '';
const match = x => !q || JSON.stringify(x).toLowerCase().includes(q); // one filter for the tables, the report and the export, so a CSV holds exactly what the screen shows
const openId = (location.hash.match(/open=([\w-]+)/) || [])[1] || null; // global search deep-links a record as crm.html#open=<id>
if (openId && store.get('deals', openId)) view = 'deals';
const app = document.getElementById('app'), dlg = document.getElementById('dlg');

function ensureCompany(name) { name = (name || '').trim(); if (!name) return null; let c = store.all('companies').find(x => x.name.toLowerCase() === name.toLowerCase()); if (!c) c = store.add('companies', { name }); return c.id; }
const companyName = id => (store.get('companies', id) || {}).name || '';
const money = n => NOL.money(n, 0);

function render() {
  if (!/join=/.test(location.hash)) location.hash = view;
  const contacts = store.all('contacts'), deals = store.all('deals'), companies = store.all('companies');
  const pipeline = deals.filter(d => !['Won', 'Lost'].includes(d.stage)).reduce((s, d) => s + (+d.amount || 0), 0);
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'CRM'), h('p', { class: 'mute' }, `${contacts.length} contacts · ${companies.length} companies · ${deals.length} deals · ${money(pipeline)} open pipeline`)),
      h('div', { class: 'toolbar' },
        h('input', { class: 'input', placeholder: 'Search…', value: q, oninput: e => { q = e.target.value.toLowerCase(); draw(); } }),
        NOL.currencySelect(),
        dups().length ? h('button', { class: 'btn', onclick: dupDialog }, `Duplicates (${dups().length})`) : null,
        h('button', { class: 'btn', onclick: importFile }, 'Import'),
        h('button', { class: 'btn ghost', onclick: exportCSV }, 'Export CSV'),
        h('button', { class: 'btn acid', onclick: () => view === 'deals' ? editDeal() : editContact() }, view === 'deals' ? '+ Deal' : '+ Contact'))),
    h('div', { class: 'row', style: 'margin-bottom:16px' }, VIEWS.map(v => h('button', { class: 'btn sm' + (v === view ? ' acid' : ' ghost'), onclick: () => { view = v; render(); } }, v[0].toUpperCase() + v.slice(1)))),
    h('div', { id: 'body' }));
  draw();
}
function draw() {
  const body = document.getElementById('body');
  const f = match;
  if (view === 'contacts') {
    const rows = store.all('contacts').filter(f).sort((a, b) => a.name.localeCompare(b.name));
    body.replaceChildren(rows.length ? h('div', { class: 'card pad0' }, h('table', { class: 'table' }, h('thead', {}, h('tr', {}, ['Name', 'Email', 'Company', 'Title', 'Phone', 'Owner'].map(t => h('th', {}, t)))),
      h('tbody', {}, rows.map(c => h('tr', { class: 'click', onclick: () => editContact(c) }, h('td', {}, h('b', {}, c.name)), h('td', { class: 'mute' }, c.email), h('td', {}, companyName(c.companyId)), h('td', { class: 'mute' }, c.title), h('td', { class: 'mono mute' }, c.phone), h('td', { class: 'mute' }, c.owner))))))
      : empty('No contacts yet', 'Import a CSV from HubSpot, Pipedrive or Salesforce, a .vcf from Google Contacts, Outlook or iCloud, or add one by hand.'));
  } else if (view === 'companies') {
    const rows = store.all('companies').filter(f).sort((a, b) => a.name.localeCompare(b.name));
    const cnt = id => store.all('contacts').filter(c => c.companyId === id).length, tot = id => store.all('deals').filter(d => d.companyId === id).reduce((s, d) => s + (+d.amount || 0), 0);
    body.replaceChildren(rows.length ? h('div', { class: 'card pad0' }, h('table', { class: 'table' }, h('thead', {}, h('tr', {}, ['Company', 'Contacts', 'Deals total', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, rows.map(c => h('tr', { class: 'click', onclick: () => location.href = 'company-page.html?id=' + c.id }, h('td', {}, h('b', {}, c.name)), h('td', { class: 'num' }, cnt(c.id)), h('td', { class: 'num' }, money(tot(c.id))), h('td', { style: 'text-align:right' }, h('button', { class: 'btn sm ghost danger', onclick: e => { e.stopPropagation(); if (confirm(NOL.t(`Delete ${c.name}? Contacts and deals stay.`))) { store.remove('companies', c.id); render(); } } }, 'Delete')))))))
      : empty('No companies yet', 'Companies appear automatically from contacts and deals.'));
  } else if (view === 'reports') {
    body.replaceChildren(reports(store.all('deals').filter(f)));
  } else {
    const deals = store.all('deals').filter(f);
    const stages = stageList(deals);
    body.replaceChildren(h('div', { class: 'kanban' }, stages.map(st => {
      const list = deals.filter(d => d.stage === st);
      const col = h('div', { class: 'col', ondragover: e => { e.preventDefault(); col.classList.add('over'); }, ondragleave: () => col.classList.remove('over'), ondrop: e => { e.preventDefault(); col.classList.remove('over'); store.update('deals', e.dataTransfer.getData('text'), { stage: st }); render(); } },
        h('h4', {}, h('span', {}, st), h('span', { class: 'mono' }, money(list.reduce((s, d) => s + (+d.amount || 0), 0)))),
        list.map(d => h('div', { class: 'kcard', draggable: true, ondragstart: e => e.dataTransfer.setData('text', d.id), onclick: () => editDeal(d) }, h('div', { class: 't' }, d.name), h('div', { class: 'm' }, h('span', { class: 'mono acid' }, money(d.amount)), h('span', {}, companyName(d.companyId)), d.close && h('span', {}, fmtDate(d.close))))));
      return col;
    })));
  }
}
function form(title, fields, onSave, onDelete, extra) {
  dlg.className = '';
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); const fd = new FormData(e.target); onSave(Object.fromEntries(fd.entries())); dlg.close(); render(); } },
    h('h3', {}, title),
    fields.map(([k, label, type, val, opts]) => h('div', { class: 'field' }, h('label', { class: 'f' }, label),
      type === 'select' ? h('select', { class: 'input', name: k }, opts.map(o => h('option', { value: o, selected: o === val }, o))) : h('input', { class: 'input', name: k, type: type || 'text', value: val ?? '' }))),
    extra,
    h('div', { class: 'actions' }, onDelete && h('button', { type: 'button', class: 'btn ghost danger', onclick: () => { if (confirm(NOL.t('Delete?'))) { onDelete(); dlg.close(); render(); } } }, 'Delete'), h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'), h('button', { class: 'btn acid' }, 'Save'))));
  dlg.showModal();
}
function editContact(c = {}) {
  form(c.id ? 'Edit contact' : 'New contact', [['name', 'Name', 'text', c.name], ['email', 'Email', 'email', c.email], ['company', 'Company', 'text', companyName(c.companyId)], ['title', 'Title', 'text', c.title], ['phone', 'Phone', 'text', c.phone], ['owner', 'Owner', 'text', c.owner]],
    v => { const rec = { name: v.name.trim() || 'Unnamed', email: v.email, title: v.title, phone: v.phone, owner: v.owner, companyId: ensureCompany(v.company) }; c.id ? store.update('contacts', c.id, rec) : store.add('contacts', rec); }, c.id && (() => store.remove('contacts', c.id)), c.id && h('div', {}, timeline('contacts', c.id), NOL.filesPanel('contacts', c.id), NOL.notesPanel('contacts', c.id)));
}
function editDeal(d = {}) {
  form(d.id ? 'Edit deal' : 'New deal', [['name', 'Deal', 'text', d.name], ['amount', 'Amount', 'number', d.amount], ['stage', 'Stage', 'select', d.stage || 'Lead', [...new Set([...STAGES, d.stage].filter(Boolean))]], ['company', 'Company', 'text', companyName(d.companyId)], ['contact', 'Contact', 'text', d.contact], ['close', 'Close date', 'date', d.close], ['owner', 'Owner', 'text', d.owner]],
    v => { const rec = { name: v.name.trim() || 'Untitled deal', amount: +v.amount || 0, stage: v.stage, contact: v.contact, close: v.close, owner: v.owner, companyId: ensureCompany(v.company) }; d.id ? store.update('deals', d.id, rec) : store.add('deals', rec); }, d.id && (() => store.remove('deals', d.id)), d.id && h('div', {}, NOL.filesPanel('deals', d.id), NOL.notesPanel('deals', d.id)));
}
// an import never makes a second copy of a person already here: same email means the same contact, its blanks filled from the file, what it already says kept
function upsertContacts(recs) {
  let added = 0, merged = 0;
  const byEmail = new Map(store.all('contacts').filter(c => c.email).map(c => [lc(c.email), c]));
  const fresh = [];
  for (const r of recs) {
    const key = lc(r.email), hit = key && byEmail.get(key);
    if (!hit) { fresh.push(r); if (key) byEmail.set(key, r); added++; continue; }
    const patch = {};
    for (const k of FILLS) if (!hit[k] && r[k]) patch[k] = r[k];
    if (hit.id && Object.keys(patch).length) store.update('contacts', hit.id, patch);
    Object.assign(hit, patch); // a duplicate inside the same file merges into the record still waiting to be added
    merged++;
  }
  if (fresh.length) store.addMany('contacts', fresh);
  return { added, merged };
}
async function importFile() {
  const files = await pickFile('.csv,.vcf,text/csv,text/vcard', true); let nc = 0, nd = 0, nm = 0;
  for (const f of files) {
    const text = await readFile(f);
    if (/^\s*BEGIN:VCARD/i.test(text) || /\.vcf$/i.test(f.name)) {                    // Google Contacts, Outlook and iCloud all export .vcf
      const r = upsertContacts(NOL.parseVCards(text).map(v => ({ name: v.name || v.email || 'Unnamed', email: v.email, phone: v.phone, title: v.title, owner: '', companyId: ensureCompany(v.company) })));
      nc += r.added; nm += r.merged;
      continue;
    }
    const { headers, rows } = csvToObjects(text); if (!rows.length) continue;
    const dm = mapHeaders(headers, DEAL_SPEC), isDeal = !!(dm.amount || (dm.stage && dm.name && /deal|opportun|stage|amount|value/i.test(headers.join(' '))));
    if (isDeal) {
      store.addMany('deals', rows.map(r => ({ name: pick(r, dm, 'name') || 'Untitled deal', amount: parseFloat(String(pick(r, dm, 'amount')).replace(/[^0-9.-]/g, '')) || 0, stage: normStage(pick(r, dm, 'stage')), contact: pick(r, dm, 'contact'), close: pick(r, dm, 'close'), owner: pick(r, dm, 'owner'), companyId: ensureCompany(pick(r, dm, 'company')) }))); nd += rows.length;
    } else {
      const cm = mapHeaders(headers, CONTACT_SPEC);
      const r = upsertContacts(rows.map(r => ({ name: fullName(r, cm) || pick(r, cm, 'email') || 'Unnamed', email: pick(r, cm, 'email'), phone: pick(r, cm, 'phone'), title: pick(r, cm, 'title'), owner: pick(r, cm, 'owner'), companyId: ensureCompany(pick(r, cm, 'company')) })));
      nc += r.added; nm += r.merged;
    }
  }
  if (files.length) { toast(nm ? `Imported ${nc} contacts, ${nd} deals, ${nm} merged.` : `Imported ${nc} contacts, ${nd} deals.`); view = nd && !nc ? 'deals' : view; render(); }
}
function exportCSV() {
  if (view === 'reports') download('pipeline-report.csv', toCSV(reportRows(store.all('deals').filter(match)), REPORT_COLS), 'text/csv');
  else if (view === 'deals') download('deals.csv', toCSV(store.all('deals').map(d => ({ ...d, company: companyName(d.companyId) })), ['name', 'amount', 'stage', 'company', 'contact', 'close', 'owner', 'created']), 'text/csv');
  else if (view === 'companies') download('companies.csv', toCSV(store.all('companies'), ['name', 'created']), 'text/csv');
  else download('contacts.csv', toCSV(store.all('contacts').map(c => ({ ...c, company: companyName(c.companyId) })), ['name', 'email', 'company', 'title', 'phone', 'owner', 'created']), 'text/csv');
}

/* ---------- duplicates: same email or same phone, merged into the fullest record ---------- */
const FILLS = ['name', 'email', 'phone', 'title', 'owner', 'companyId'];
const lc = x => String(x || '').trim().toLowerCase();
const filled = c => FILLS.filter(k => c[k]).length;
const dups = () => dupGroups(store.all('contacts'));
const primary = g => g.reduce((a, b) => filled(b) > filled(a) || (filled(b) === filled(a) && (b.created || '') < (a.created || '')) ? b : a); // the fullest record wins, the older one breaks the tie
function mergeGroup(g) {
  const keep = primary(g), rest = g.filter(c => c !== keep), patch = {};
  for (const k of FILLS) if (!keep[k]) { const v = rest.map(r => r[k]).find(Boolean); if (v) patch[k] = v; }
  if (Object.keys(patch).length) store.update('contacts', keep.id, patch);
  const m = store.get('contacts', keep.id) || keep;
  for (const r of rest) {
    for (const coll of ['notes', 'files']) store.all(coll).filter(x => x.coll === 'contacts' && x.ref === r.id).forEach(x => store.update(coll, x.id, { ref: keep.id }));
    // deals and tickets point at a contact by name, not by id: move them onto the surviving name so the timeline keeps them
    if (r.name) store.all('deals').filter(d => lc(d.contact) === lc(r.name)).forEach(d => store.update('deals', d.id, { contact: m.name }));
    store.all('tickets').filter(t => (r.email && lc(t.email) === lc(r.email)) || (r.name && lc(t.requester) === lc(r.name))).forEach(t => store.update('tickets', t.id, { requester: m.name, email: m.email || t.email }));
    store.remove('contacts', r.id); // tombstone: Trash restores it
  }
}
function dupDialog() {
  const paint = () => {
    const gs = dups();
    dlg.replaceChildren(h('div', { style: 'padding:22px' },
      h('h3', {}, 'Duplicate contacts'),
      h('p', { class: 'mute', style: 'margin-bottom:14px;font-size:13px' }, 'Same email or same phone. Merging keeps the fullest record, fills its blanks from the copies, moves their notes, files, deals and tickets over, and sends the copies to Trash.'),
      gs.length ? h('div', { class: 'stack' }, gs.map(g => {
        const keep = primary(g);
        return h('div', { class: 'card pad0' },
          h('div', { class: 'row between', style: 'padding:12px 14px' },
            h('b', {}, keep.name || '—'),
            h('button', { class: 'btn sm acid', onclick: () => { mergeGroup(g); toast('Merged.'); paint(); render(); } }, 'Merge')),
          h('table', { class: 'table' }, h('tbody', {}, g.map(c => h('tr', {},
            h('td', {}, h('span', { class: 'badge' + (c === keep ? ' acid' : '') }, c === keep ? 'keep' : 'copy')),
            h('td', {}, h('b', {}, c.name || '—')),
            h('td', { class: 'mute' }, c.email),
            h('td', { class: 'mono mute' }, c.phone),
            h('td', { class: 'mute' }, companyName(c.companyId)))))));
      })) : h('p', { class: 'mute' }, 'No duplicates. Contacts sharing an email or a phone number show up here.'),
      h('div', { class: 'actions' },
        gs.length > 1 ? h('button', { class: 'btn ghost', onclick: () => { gs.forEach(mergeGroup); toast('Merged.'); paint(); render(); } }, 'Merge all') : null,
        h('button', { class: 'btn acid', onclick: () => dlg.close() }, 'Close'))));
  };
  dlg.className = 'dupdlg'; paint(); dlg.showModal();
}

/* ---------- reports: pipeline by stage and owner, win rate, closed-won by month, the same numbers as CSV ---------- */
const loc = () => NOL.lang() === 'ru' ? 'ru-RU' : 'en-US';
const sum = a => a.reduce((s, d) => s + (+d.amount || 0), 0);
const isOpen = d => !['Won', 'Lost'].includes(d.stage);
const isWon = d => d.stage === 'Won';
const stageList = deals => [...new Set([...STAGES, ...deals.map(d => d.stage).filter(Boolean)])];
const ownerOf = d => d.owner || 'Unassigned';
const normStage = s => { s = String(s || '').trim(); return /won/i.test(s) ? 'Won' : /lost/i.test(s) ? 'Lost' : s || 'Lead'; }; // HubSpot, Pipedrive and Salesforce export "Closed Won" / "Closed Lost"; the report counts Won and Lost
const winRate = list => { const w = list.filter(isWon).length, closed = w + list.filter(d => d.stage === 'Lost').length; return closed ? Math.round(w / closed * 100) : null; };
function monthsOf(deals) { // the last 12 months of closed won, oldest first
  const n = new Date(), out = [];
  for (let i = 11; i >= 0; i--) { const dd = new Date(n.getFullYear(), n.getMonth() - i, 1); out.push({ key: dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0'), label: dd.toLocaleDateString(loc(), { month: 'short' }), value: 0, count: 0 }); }
  const byKey = new Map(out.map(m => [m.key, m]));
  for (const d of deals.filter(isWon)) { const m = byKey.get(String(d.close || d.created || '').slice(0, 7)); if (m) { m.value += +d.amount || 0; m.count++; } }
  return out;
}
const REPORT_COLS = ['report', 'label', 'deals', 'open pipeline', 'closed won', 'win rate %'];
function reportRows(deals) { // one file, three blocks in the order of the screen: stages, owners, months
  const row = (report, label, list) => ({ report, label, deals: list.length, 'open pipeline': sum(list.filter(isOpen)), 'closed won': sum(list.filter(isWon)) });
  return [
    ...stageList(deals).map(st => row('Stage', st, deals.filter(d => d.stage === st))),
    ...[...new Set(deals.map(ownerOf))].sort().map(o => { const mine = deals.filter(d => ownerOf(d) === o), r = winRate(mine); return { ...row('Owner', o, mine), 'win rate %': r == null ? '' : r }; }),
    ...monthsOf(deals).map(m => ({ report: 'Month', label: m.key, deals: m.count, 'closed won': m.value })),
  ];
}
function lineChart(pts, fmt) {
  const W = 900, H = 200, L = 54, R = 14, B = 26, T = 14, max = Math.max(1, ...pts.map(p => p.value));
  const x = i => L + (W - L - R) * (pts.length < 2 ? .5 : i / (pts.length - 1));
  const y = v => H - B - (H - B - T) * (v / max);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ');
  return svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}` },
    svg('line', { class: 'ax', x1: L, y1: T, x2: W - R, y2: T }),
    svg('line', { class: 'ax', x1: L, y1: H - B, x2: W - R, y2: H - B }),
    svg('path', { class: 'ar', d: `${d} L${x(pts.length - 1).toFixed(1)} ${H - B} L${x(0).toFixed(1)} ${H - B} Z` }),
    svg('path', { class: 'ln', d }),
    pts.map((p, i) => svg('circle', { class: 'dt', cx: x(i).toFixed(1), cy: y(p.value).toFixed(1), r: 3.2 }, svg('title', {}, `${p.label} · ${fmt(p.value)}`))),
    pts.map((p, i) => svg('text', { class: 'lb', x: x(i).toFixed(1), y: H - 8, 'text-anchor': 'middle' }, p.label)),
    svg('text', { class: 'vl', x: 2, y: T + 4 }, fmt(max)),
    svg('text', { class: 'vl', x: 2, y: H - B }, fmt(0)));
}
const donut = pct => svg('svg', { class: 'donut', viewBox: '0 0 36 36' },
  svg('circle', { class: 'bg', cx: 18, cy: 18, r: 15.9155 }),
  pct > 0 ? svg('circle', { class: 'fg', cx: 18, cy: 18, r: 15.9155, 'stroke-dasharray': `${pct} ${100 - pct}`, transform: 'rotate(-90 18 18)' }) : null,
  svg('text', { class: 'pc', x: 18, y: 20.6 }, pct + '%'));
const card = (title, node) => h('div', { class: 'card' }, h('h3', { style: 'margin-bottom:14px;font-size:16px' }, title), node);
function reports(deals) {

  const open = deals.filter(isOpen), won = deals.filter(isWon), lost = deals.filter(d => d.stage === 'Lost');

    h('div', { class: 'grid g6' },
      tile(money(sum(open)), 'open pipeline', { d: `${open.length} deals`, cls: 'acc' }),
      tile(money(sum(won)), 'closed won', { d: `${won.length} deals` }),
      tile(rate + '%', 'win rate', { d: `${closed} closed` }),

    h('div', { class: 'grid g2' },

        h('div', {}, h('p', {}, `${won.length} won`), h('p', { class: 'mute' }, `${lost.length} lost`), h('p', { class: 'mute' }, `${open.length} still open`)))),
      card('Pipeline by stage', bars(stages.map(st => ({ label: st, value: sum(deals.filter(d => d.stage === st)), color: st === 'Won' ? 'var(--ok)' : st === 'Lost' ? 'var(--red)' : 'var(--acid)' })), money))),
    card('Closed won by month', h('div', { class: 'chartwrap' }, lineChart(months, money))), // narrow screens scroll the chart instead of shrinking its labels to nothing

      h('div', { class: 'card pad0' }, h('table', { class: 'table' },
        h('thead', {}, h('tr', {}, ['Owner', 'Open pipeline', 'Closed won', 'Deals', 'Win rate'].map(x => h('th', {}, x)))),
        h('tbody', {}, owners.map(o => {
          const mine = of(o), r = winRate(mine);
          return h('tr', {}, h('td', {}, h('b', {}, o)), h('td', { class: 'num' }, money(sum(mine.filter(isOpen)))), h('td', { class: 'num' }, money(sum(mine.filter(isWon)))), h('td', { class: 'num' }, mine.length), h('td', { class: 'num' }, r == null ? '—' : r + '%'));
        }))))));
}

addEventListener("nol:change", () => render());
render();
if (openId) { const c = store.get('contacts', openId), d = store.get('deals', openId); if (c) editContact(c); else if (d) editDeal(d); }
