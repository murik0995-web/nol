<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL Audit log · free change history</title>
<meta name="description" content="Every add, edit and delete across every NOL app: who made it, when, and which fields changed, with a link back to the record. Free, open source, in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9ff3d'/><text x='32' y='45' font-family='monospace' font-weight='700' font-size='38' text-anchor='middle' fill='%23121400'>0</text></svg>">
<link rel="stylesheet" href="../assets/nol.css"></head><body>
<main class="wrap app" id="app"></main>
<script src="../assets/nol.js"></script>
<script>
const { store, h, empty } = NOL;
NOL.topbar('audit');
const app = document.getElementById('app');

// collection → app file it lives in, for the deep link every app already opens with #open=<id> (companies and pages use their own scheme)
const APP_OF = {
  companies: 'crm', contacts: 'crm', deals: 'crm', tickets: 'desk', people: 'people', timeoff: 'leave', pages: 'wiki', tasks: 'tasks',
  invoices: 'invoices', expenses: 'expenses', timelogs: 'timesheets', macros: 'desk', goals: 'goals', jobs: 'hiring', candidates: 'hiring',
  items: 'inventory', movements: 'inventory', subscriptions: 'subscriptions', quotes: 'quotes', pricelist: 'quotes', contracts: 'contracts',
  templates: 'contracts', assets: 'assets', standups: 'standups', checkins: 'standups', meetings: 'meetings', holidays: 'leave',
  retros: 'retros', retrocards: 'retros', components: 'status', incidents: 'status', cashflow: 'cashflow', roadmap: 'roadmap',
  releases: 'changelog', metrics: 'dashboard', holdings: 'captable', rounds: 'captable', onboardings: 'onboarding', onboardplans: 'onboarding',
  cycles: 'reviews', reviews: 'reviews', purchases: 'purchase', feedback: 'feedback', mindmaps: 'mindmaps', budgets: 'budgets', rooms: 'rooms',
  bookings: 'rooms', courses: 'training', enrollments: 'training', boards: 'whiteboard', shapes: 'whiteboard',
};
const LABEL = {
  companies: 'Company', contacts: 'Contact', deals: 'Deal', tickets: 'Ticket', people: 'Person', timeoff: 'Time off', pages: 'Page',
  tasks: 'Task', invoices: 'Invoice', expenses: 'Expense', timelogs: 'Time entry', settings: 'Setting', files: 'File', macros: 'Macro',
  goals: 'Goal', jobs: 'Job', candidates: 'Candidate', items: 'Item', movements: 'Stock movement', subscriptions: 'Subscription',
  quotes: 'Quote', pricelist: 'Price list line', contracts: 'Contract', templates: 'Template', assets: 'Asset', standups: 'Standup',
  checkins: 'Check-in', meetings: 'Meeting', holidays: 'Holiday', retros: 'Retro', retrocards: 'Retro card', components: 'Component',
  incidents: 'Incident', cashflow: 'Cash flow', roadmap: 'Roadmap item', releases: 'Update', metrics: 'Metric', holdings: 'Shareholder',
  rounds: 'Round', onboardings: 'Onboarding', onboardplans: 'Onboarding plan', cycles: 'Cycle', reviews: 'Review',
  purchases: 'Purchase order', feedback: 'Idea', mindmaps: 'Mind map', budgets: 'Budget line', rooms: 'Room or desk', bookings: 'Booking',
  courses: 'Course', enrollments: 'Enrolment', boards: 'Board', shapes: 'Sticky note',
};
const ACTION_LABEL = { add: 'added', update: 'edited', remove: 'deleted' }; // same words trash-history already uses for the same three verbs, already in the shared dictionary
const ACTION_TONE = { add: 'ok', update: 'blue', remove: 'red' };
function cardUrl(c, ref) {
  if (c === 'companies') return 'company-page.html?id=' + ref;
  if (c === 'pages') return 'wiki.html#' + ref;
  const base = APP_OF[c];
  return base ? base + '.html#open=' + ref : '';
}
const dt = s => s ? new Date(s).toLocaleString(NOL.lang() === 'ru' ? 'ru-RU' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

let fColl = '', fWho = '';
function render() {
  const all = store.all('audit').slice().sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  const colls = [...new Set(all.map(r => r.coll))].sort();
  const whos = [...new Set(all.map(r => r.who))].sort();
  const rows = all.filter(r => (!fColl || r.coll === fColl) && (!fWho || r.who === fWho)).slice(0, 200);
  app.replaceChildren(
    h('div', { class: 'app-head' },
      h('div', {}, h('h2', {}, 'Audit log'), h('p', { class: 'mute' }, rows.length === all.length ? `${all.length} entries` : `${rows.length} of ${all.length} entries`)),
      h('div', { class: 'toolbar' },
        h('select', { class: 'input', onchange: e => { fColl = e.target.value; render(); } },
          h('option', { value: '' }, 'All types'),
          colls.map(c => h('option', { value: c, selected: c === fColl }, LABEL[c] || c))),
        h('select', { class: 'input', onchange: e => { fWho = e.target.value; render(); } },
          h('option', { value: '' }, 'All people'),
          whos.map(w => h('option', { value: w, selected: w === fWho }, w))))),
    !all.length ? empty('No audit entries yet', 'Every add, edit and delete across NOL lands here automatically: who made it, when, and which fields changed.')
      : !rows.length ? h('p', { class: 'mute' }, 'Nothing matches these filters.')
      : h('div', { class: 'card pad0' }, h('table', { class: 'table' },
          h('thead', {}, h('tr', {}, ['When', 'Who', 'Action', 'Type', 'Card', 'Fields changed'].map(x => h('th', {}, x)))),
          h('tbody', {}, rows.map(rowEl)))));
}
function rowEl(r) {
  const url = cardUrl(r.coll, r.ref);
  const card = url ? h('a', { href: url }, 'Open →') : h('span', { class: 'mute' }, '—');
  const action = h('span', { class: 'badge ' + (ACTION_TONE[r.action] || '') }, ACTION_LABEL[r.action] || r.action);
  const type = h('span', { class: 'badge' }, LABEL[r.coll] || r.coll);
  return h('tr', {},
    h('td', { class: 'mute mono' }, dt(r.ts || r.created)),
    h('td', { 'data-notranslate': true }, r.who || ''),
    h('td', {}, action),
    h('td', {}, type),
    h('td', {}, card),
    h('td', { class: 'mute', 'data-notranslate': true }, (r.fields || []).join(', ') || '—'));
}
addEventListener("nol:change", () => render());
render();
</script></body></html>
