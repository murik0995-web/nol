name: daemon-selftest
on:
  push:
    branches: [main]
    paths: ['factory/daemon/**']
  pull_request:
    paths: ['factory/daemon/**']
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node factory/daemon/selftest.mjs
